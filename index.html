            <div style={{fontSize:9.5,color:"var(--mut2)"}}>v{VERSION}</div>
          </div>
        </div>
        <button onClick={onClose} className="mobile-only" aria-label="Đóng" style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"var(--mut)",padding:6}}>✕</button>
      </div>
      <div style={{padding:"11px 14px",background:bg,borderBottom:"1px solid var(--bd2)",display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:38,height:38,borderRadius:"50%",background:"#fff",color:tc,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,boxShadow:"var(--sh-sm)"}}>{inits(currentUser.name)}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,color:"var(--text)",fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{currentUser.name}</div>
          <div style={{fontSize:10.5,color:tc,fontWeight:700,display:"flex",alignItems:"center",gap:4}}>
            <span>{RL[er]||er}</span>
            {roleSwitched && <span title="Admin đang xem như thành viên" style={{fontSize:9,padding:"1px 6px",background:"#fff",borderRadius:"var(--r-pill)",color:"var(--or)",fontWeight:800}}>chế độ TV</span>}
          </div>
        </div>
      </div>
      {currentShift && (
        <div style={{padding:"8px 14px",background:"linear-gradient(90deg,#FFF4F0 0%,#FFF8F4 100%)",borderBottom:"1px solid var(--bd2)",fontSize:11,color:"#92400e",display:"flex",alignItems:"center",gap:6}}>
          <i className="ti ti-clock-hour-4" style={{fontSize:14,color:"var(--or)"}}/>
          <span><b>{currentShift.name}</b> · {currentShift.start_at}–{currentShift.end_at}</span>
        </div>
      )}
      {/* v1.4: Presence — ai đang online */}
      <div style={{padding:"8px 14px",borderBottom:"1px solid var(--bd2)",fontSize:11,color:"var(--text2)"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:onlineUsers.length?6:0}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:"#22c55e",boxShadow:"0 0 0 3px rgba(34,197,94,.2)",animation:"pulse 2s infinite"}}/>
          <span style={{fontWeight:700,color:"var(--text)"}}>{onlineUsers.length} đang online</span>
        </div>
        {onlineUsers.length>0 && (
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
            {onlineUsers.slice(0,6).map(u=>{
              const off = u.role==="off" || !u.role;
              const [c,b] = off ? ["#64748B","#F1F5F9"] : (RC[u.role]||["#475569","#f5f5f5"]);
              return (
                <span key={u.id} title={`${u.name} · ${off?"Ngoài ca":(RL[u.role]||u.role)}`} style={{fontSize:10,padding:"2px 7px",borderRadius:"var(--r-pill)",background:b,color:c,fontWeight:700,whiteSpace:"nowrap",opacity:off?.7:1,fontStyle:off?"italic":"normal"}}>
                  {u.name.split(" ").slice(-1)[0]}{off && " ·"}
                </span>
              );
            })}
            {onlineUsers.length>6 && <span style={{fontSize:10,padding:"2px 7px",color:"var(--mut)"}}>+{onlineUsers.length-6}</span>}
          </div>
        )}
      </div>
      <nav style={{flex:1,padding:"8px 8px",overflowY:"auto"}}>
        {nav.map(n=>{
          const ac=screen===n.k;
          return (
            <button key={n.k} onClick={()=>setScreen(n.k)}
              style={{width:"100%",display:"flex",alignItems:"center",gap:11,padding:"11px 13px",border:"none",cursor:"pointer",textAlign:"left",fontSize:13,fontWeight:ac?700:500,background:ac?"var(--orl)":"transparent",color:ac?"var(--or)":"var(--text2)",borderRadius:"var(--r-md)",marginBottom:2,transition:"all .15s var(--ease)",position:"relative",boxShadow:ac?"var(--sh-sm)":"none"}}
              onMouseOver={e=>{if(!ac){e.currentTarget.style.background="#FAFAFA";e.currentTarget.style.color="var(--text)"}}}
              onMouseOut={e=>{if(!ac){e.currentTarget.style.background="transparent";e.currentTarget.style.color="var(--text2)"}}}>
              {ac&&<span style={{position:"absolute",left:-8,top:"50%",transform:"translateY(-50%)",width:3,height:18,background:"var(--or)",borderRadius:"0 3px 3px 0"}}/>}
              <i className={`ti ${n.icon}`} style={{fontSize:18}}/>
              <span style={{flex:1}}>{n.label}</span>
              {n.badge&&<span style={{fontSize:10,fontWeight:800,padding:"2px 7px",borderRadius:"var(--r-pill)",background:"var(--or-grad)",color:"#fff",minWidth:20,textAlign:"center",boxShadow:"var(--sh-or)"}}>{n.badge}</span>}
            </button>
          );
        })}
      </nav>
      <div style={{padding:"10px 12px",borderTop:"1px solid var(--bd2)",display:"flex",flexDirection:"column",gap:8}}>
        {onViewAsMember && (
          <button onClick={onViewAsMember} title="Chạy app như một thành viên theo ca được phân"
            style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"10px",borderRadius:"var(--r-md)",border:"1px solid #C4B5FD",background:"#F5F3FF",color:"#6D28D9",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>
            <i className="ti ti-user-cog" style={{fontSize:15}}/>Xem như Thành viên
          </button>
        )}
        <button onClick={onLogout} className="btn-ghost" style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"10px",borderRadius:"var(--r-md)",color:"var(--err)",borderColor:"#FCA5A5",fontSize:12.5,fontWeight:600}}>
          <i className="ti ti-logout" style={{fontSize:15}}/>Đăng xuất
        </button>
      </div>
    </div>
  );
}

function TopBar({title,sub,time,currentUser,connStatus,onLogout,onMenu,effectiveRole,currentShift,notifEnabled,onToggleNotif,soundEnabled,onToggleSound}){
  const er = effectiveRole || "off";
  const [tc,bg] = RC[er]||["#475569","#f5f5f5"];
  const conn = {
    live:    {color:"#22c55e",text:"Realtime",pulse:true},
    connecting:{color:"#f59e0b",text:"Đang kết nối",pulse:true},
    offline: {color:"#ef4444",text:"Mất kết nối",pulse:false},
  }[connStatus] || {color:"#94a3b8",text:"—",pulse:false};
  return (
    <div style={{padding:"10px 16px",borderBottom:"2.5px solid var(--or)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#fff",flexShrink:0,gap:10,boxShadow:"0 2px 8px rgba(0,0,0,.03)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
        <button onClick={onMenu} className="mobile-only" aria-label="Menu" style={{background:"var(--orl)",border:"none",cursor:"pointer",fontSize:22,color:"var(--or)",padding:8,borderRadius:"var(--r-sm)"}}>
          <i className="ti ti-menu-2"/>
        </button>
        <div style={{minWidth:0}}>
          <div style={{fontSize:15.5,fontWeight:800,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",letterSpacing:-.2}}>{title}</div>
          <div style={{fontSize:11,color:"var(--mut)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{sub}</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <div className="topbar-meta" style={{display:"flex",alignItems:"center",gap:6,fontSize:11.5,color:"var(--mut)",padding:"5px 11px",background:"#FAFAFA",borderRadius:"var(--r-pill)",border:"1px solid var(--bd2)"}}>
          <i className="ti ti-clock" style={{fontSize:13,color:"var(--or)"}}/>
          <span style={{fontWeight:600,color:"var(--text2)"}}>{time}</span>
          <span style={{color:"var(--mut2)"}}>·</span>
          <span>{todayS()}</span>
        </div>
        <div title={conn.text} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",background:conn.color+"18",borderRadius:"var(--r-pill)",border:`1px solid ${conn.color}33`}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:conn.color,animation:conn.pulse?"pulse 2s infinite":"none",boxShadow:`0 0 0 3px ${conn.color}25`}}/>
          <span className="hide-mobile" style={{fontSize:10.5,color:conn.color,fontWeight:700}}>{conn.text}</span>
        </div>
        <button onClick={onToggleSound} title={soundEnabled?"Tắt âm thanh báo đơn":"Bật âm thanh báo đơn"} aria-label="Âm thanh"
          style={{width:36,height:36,borderRadius:"50%",border:`1px solid ${soundEnabled?"var(--or)":"var(--bd)"}`,background:soundEnabled?"var(--orl)":"#fff",color:soundEnabled?"var(--or)":"var(--mut2)",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:soundEnabled?"var(--sh-sm)":"none"}}>
          <i className={`ti ${soundEnabled?"ti-volume":"ti-volume-off"}`}/>
        </button>
        <button onClick={onToggleNotif} title={notifEnabled?"Tắt thông báo":"Bật thông báo"} aria-label="Thông báo"
          style={{width:36,height:36,borderRadius:"50%",border:`1px solid ${notifEnabled?"var(--or)":"var(--bd)"}`,background:notifEnabled?"var(--orl)":"#fff",color:notifEnabled?"var(--or)":"var(--mut2)",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:notifEnabled?"var(--sh-sm)":"none"}}>
          <i className={`ti ${notifEnabled?"ti-bell-ringing":"ti-bell-off"}`}/>
        </button>
        <div className="hide-mobile" style={{display:"flex",alignItems:"center",gap:8,padding:"4px 12px 4px 4px",background:"#fff",border:"1px solid var(--bd)",borderRadius:"var(--r-pill)",boxShadow:"var(--sh-sm)"}}>
          <div style={{width:30,height:30,borderRadius:"50%",background:bg,color:tc,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800}}>{inits(currentUser.name)}</div>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:12,fontWeight:700,color:"var(--text)",lineHeight:1.15}}>{currentUser.name}</div>
            <div style={{fontSize:9.5,color:tc,fontWeight:700,lineHeight:1.25}}>{RL[er]||er}{currentShift?` · ${currentShift.name}`:""}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════════════════ */
function Dashboard({orders:allOrders,staff,currentUser,deleteOrder,viewDate,setViewDate}){
  const isAdmin = currentUser?.isAdmin === true;
  const [view,setView] = useState("day"); // v1.13: "day"=theo ngày | "all"=toàn chuỗi
  // lọc theo ngày đang xem, hoặc TOÀN BỘ (toàn chuỗi)
  const orders = view==="all" ? allOrders : allOrders.filter(o=>orderDay(o)===viewDate);
  const done  = orders.filter(o=>o.st==="hoan_thanh");
  const rev   = done.reduce((s,o)=>s+iTot(o),0);
  const ship  = orders.filter(o=>o.type==="ship"&&o.st==="hoan_thanh");
  const active= orders.filter(o=>!["hoan_thanh","huy"].includes(o.st));
  // chart theo GIỜ — dùng cho view "theo ngày"
  const bars  = useMemo(()=>{
    const b=Array(8).fill(0);
    orders.forEach(o=>{const h=parseInt((o.t||"00:00").split(":")[0],10);const i=h-7;if(i>=0&&i<8)b[i]++;});
    return b;
  },[orders]);
  const maxB=Math.max(...bars,1);
  // chart doanh thu theo NGÀY — dùng cho view "toàn chuỗi" (14 ngày gần nhất có đơn)
  const daily = useMemo(()=>{
    const m={};
    allOrders.forEach(o=>{const d=orderDay(o);(m[d]=m[d]||{rev:0,cnt:0});m[d].cnt++;if(o.st==="hoan_thanh")m[d].rev+=iTot(o);});
    return Object.keys(m).sort().slice(-14).map(d=>({d,...m[d]}));
  },[allOrders]);
  const maxDayRev=Math.max(...daily.map(x=>x.rev),1);
  const totalDays=useMemo(()=>new Set(allOrders.map(o=>orderDay(o))).size,[allOrders]);

  const cards=[
    {l:"Tổng đơn",v:orders.length,ic:"ti-clipboard-list",bg:"var(--orl)",tc:"var(--or)",accent:"linear-gradient(135deg,#FFF4F0 0%,#FFE0D6 100%)"},
    {l:"Doanh thu",v:fmt(rev),ic:"ti-cash",bg:"var(--ok-bg)",tc:"var(--ok)",accent:"linear-gradient(135deg,#F0FDF4 0%,#DCFCE7 100%)"},
    {l:"Đang xử lý",v:active.length,ic:"ti-loader-2",bg:"var(--info-bg)",tc:"var(--info)",accent:"linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 100%)"},
    {l:"Thu phí ship",v:fmt(ship.reduce((s,o)=>s+o.dFee,0)),ic:"ti-motorbike",bg:"#F3EFFF",tc:"#7C3AED",accent:"linear-gradient(135deg,#F5F3FF 0%,#EDE9FE 100%)"},
  ];

  return (
    <div style={{flex:1,overflowY:"auto",padding:18,background:"var(--bg)"}}>
      <div style={{display:"flex",gap:10,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{display:"flex",background:"#fff",border:"1px solid var(--bd)",borderRadius:"var(--r-md)",padding:3,boxShadow:"var(--sh-sm)"}}>
          {[["day","ti-calendar-event","Theo ngày"],["all","ti-chart-line","Toàn chuỗi"]].map(([v,ic,l])=>(
            <button key={v} onClick={()=>setView(v)} style={{padding:"7px 15px",border:"none",borderRadius:"var(--r-sm)",cursor:"pointer",fontSize:12.5,fontWeight:700,background:view===v?"var(--or)":"transparent",color:view===v?"#fff":"var(--text2)",display:"flex",alignItems:"center",gap:6,transition:"all .15s"}}>
              <i className={`ti ${ic}`} style={{fontSize:15}}/>{l}
            </button>
          ))}
        </div>
        {view==="all" && <span style={{fontSize:12,color:"var(--mut)"}}>Tổng kết toàn bộ chuỗi · <b style={{color:"var(--text)"}}>{totalDays}</b> ngày hoạt động · <b style={{color:"var(--ok)"}}>{fmt(rev)}</b> doanh thu</span>}
      </div>
      {view==="day" && <DateNav date={viewDate} setDate={setViewDate} countLabel={`${orders.length} đơn · ${done.length} hoàn thành · DT ${fmt(rev)}`}/>}
      <div className="grid-stats-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:14}}>
        {cards.map(s=>(
          <div key={s.l} className="card card-hover" style={{padding:"16px 16px 14px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,right:0,width:80,height:80,background:s.accent,borderRadius:"0 0 0 100%",opacity:.55}}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,position:"relative"}}>
              <div style={{fontSize:11,color:"var(--mut)",fontWeight:600,textTransform:"uppercase",letterSpacing:.3}}>{s.l}</div>
              <div style={{width:36,height:36,borderRadius:"var(--r-md)",background:s.bg,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"var(--sh-sm)"}}>
                <i className={`ti ${s.ic}`} style={{fontSize:19,color:s.tc}}/>
              </div>
            </div>
            <div style={{fontSize:24,fontWeight:800,color:"var(--text)",position:"relative",letterSpacing:-.3}}>{s.v}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:12,marginBottom:12}}>
        <div className="card" style={{padding:18}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,color:"var(--text)",display:"flex",alignItems:"center",gap:6}}><i className="ti ti-chart-bar" style={{fontSize:16,color:"var(--or)"}}/>{view==="all"?"Doanh thu theo ngày":"Đơn hàng theo giờ"}</div>
            <span className="chip">{view==="all"?`${daily.length} ngày gần nhất`:"8 khung giờ"}</span>
          </div>
          {view==="day" ? (
          <div style={{display:"flex",alignItems:"flex-end",gap:10,height:130,paddingBottom:4}}>
            {bars.map((v,i)=>{
              const hCur=new Date().getHours();
              const isCur=(7+i)===hCur;
              return (
                <div key={i} title={`${7+i}:00 — ${v} đơn`} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"default"}}>
                  <div style={{fontSize:10.5,color:isCur?"var(--or)":"var(--mut)",fontWeight:700}}>{v||""}</div>
                  <div style={{width:"100%",height:Math.round((v/maxB)*92)||3,background:isCur?"var(--or-grad)":"linear-gradient(180deg,#FFD4C2 0%,#FFB8A0 100%)",borderRadius:"6px 6px 2px 2px",transition:"height .6s var(--ease)",boxShadow:isCur?"var(--sh-or)":"none"}}/>
                  <div style={{fontSize:10,color:isCur?"var(--or)":"var(--mut2)",fontWeight:isCur?700:500}}>{7+i}h</div>
                </div>
              );
            })}
          </div>
          ) : (
          <div style={{display:"flex",alignItems:"flex-end",gap:6,height:130,paddingBottom:4,overflowX:"auto"}}>
            {daily.length===0 && <div style={{margin:"auto",color:"var(--mut2)",fontSize:12}}>Chưa có dữ liệu</div>}
            {daily.map((x,i)=>(
              <div key={x.d} title={`${isoToVN(x.d)} — ${fmt(x.rev)} · ${x.cnt} đơn`} style={{flex:"1 0 26px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"default"}}>
                <div style={{fontSize:9,color:"var(--mut)",fontWeight:700,whiteSpace:"nowrap"}}>{x.rev?Math.round(x.rev/1000)+"k":""}</div>
                <div style={{width:"100%",height:Math.round((x.rev/maxDayRev)*92)||3,background:"linear-gradient(180deg,#86EFAC 0%,#22C55E 100%)",borderRadius:"5px 5px 2px 2px",transition:"height .6s var(--ease)"}}/>
                <div style={{fontSize:9,color:"var(--mut2)",fontWeight:600,whiteSpace:"nowrap"}}>{isoToVNShort(x.d)}</div>
              </div>
            ))}
          </div>
          )}
        </div>
        <div className="card" style={{padding:18}}>
          <div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:14,display:"flex",alignItems:"center",gap:6}}><i className="ti ti-progress" style={{fontSize:16,color:"var(--or)"}}/>Trạng thái đơn</div>
          {Object.entries(ST).map(([s,d])=>{
            const n=orders.filter(o=>o.st===s).length;
            const pct=orders.length?Math.round((n/orders.length)*100):0;
            return (
              <div key={s} style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <div style={{minWidth:88}}><Bdg s={s}/></div>
                <div style={{flex:1,height:6,background:"#F3F4F6",borderRadius:3,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:d.color,borderRadius:3,transition:"width .6s var(--ease)"}}/>
                </div>
                <span style={{fontSize:11,color:"var(--text2)",minWidth:22,textAlign:"right",fontWeight:700}}>{n}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card" style={{padding:18}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
          <i className="ti ti-history" style={{fontSize:16,color:"var(--or)"}}/>
          Đơn hàng gần đây
          {isAdmin && <span style={{fontSize:10,fontWeight:600,color:"var(--mut)",marginLeft:4}}>· Hiển thị {Math.min(orders.length,30)}/{orders.length} đơn · Admin có quyền xoá</span>}
        </div>
        <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11.5}}>
          <thead>
            <tr style={{background:"#FAFAFA"}}>{[...["Mã đơn","Khách hàng","Giờ","Sản phẩm","Tổng","Loại","Người KPI","Trạng thái"], ...(isAdmin?["Hành động"]:[])].map(h=>(
              <th key={h} style={{padding:"9px 10px",textAlign:"left",fontSize:10,color:"var(--mut)",fontWeight:700,borderBottom:"1px solid var(--bd)",letterSpacing:.4,textTransform:"uppercase"}}>{h}</th>
            ))}</tr>
          </thead>
          <tbody>
            {[...orders].reverse().slice(0, isAdmin ? 30 : 6).map(o=>(
              <tr key={o.id} style={{borderBottom:"1px solid #F5F5F5",transition:"background .15s"}}
                  onMouseOver={e=>e.currentTarget.style.background="#FAFAFA"}
                  onMouseOut={e=>e.currentTarget.style.background="transparent"}>
                <td style={{padding:"10px",fontFamily:"ui-monospace,monospace",color:"var(--or)",fontWeight:800}}>{o.id}</td>
                <td style={{padding:"10px",color:"var(--text)",fontWeight:600}}>{o.cus}</td>
                <td style={{padding:"10px",color:"var(--mut)"}}>{o.t}</td>
                <td style={{padding:"10px",color:"var(--text2)",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.items.map(i=>`${i.name}×${i.qty}`).join(", ")}</td>
                <td style={{padding:"10px",fontWeight:800,color:"var(--text)"}}>{fmt(iTot(o))}</td>
                <td style={{padding:"10px"}}><TPill type={o.type}/></td>
                <td style={{padding:"10px",color:"var(--text2)",fontSize:11}}>{staff.find(s=>s.id===o.kpi)?.name||"—"}</td>
                <td style={{padding:"10px"}}><Bdg s={o.st}/></td>
                {isAdmin && (
                  <td style={{padding:"10px"}}>
                    <button onClick={()=>deleteOrder(o.id)} title="Xoá vĩnh viễn đơn này"
                      style={{background:"#FEE2E2",border:"1px solid #FCA5A5",color:"#B91C1C",padding:"4px 9px",borderRadius:5,fontSize:11,fontWeight:700,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:3}}
                      onMouseOver={e=>e.currentTarget.style.background="#FECACA"}
                      onMouseOut={e=>e.currentTarget.style.background="#FEE2E2"}>
                      <i className="ti ti-trash" style={{fontSize:12}}/>Xoá
                    </button>
                  </td>
                )}
              </tr>
            ))}
            {orders.length===0&&(
              <tr><td colSpan={isAdmin?9:8} style={{padding:"32px 10px",textAlign:"center",color:"var(--mut2)",fontSize:12}}>
                <i className="ti ti-clipboard-off" style={{fontSize:32,display:"block",marginBottom:6,opacity:.5}}/>
                Chưa có đơn hàng nào
              </td></tr>
            )}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   ORDER SCREEN
══════════════════════════════════════════════════════════ */
/* v1.4: Searchable KPI combobox — hỗ trợ chọn người ngoài ca */
/* v1.9: Generic staff combobox — tự gõ filter + dropdown. Trả về staff.id khi chọn. */
function StaffCombo({staffList,onPick,placeholder="+ Thêm nhân sự...",accent="var(--or)",size="sm"}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState("");
  const ref=useRef(null);
  useEffect(()=>{
    if(!open) return;
    const h=e=>{ if(ref.current && !ref.current.contains(e.target)){ setOpen(false); setQ(""); } };
    document.addEventListener("mousedown",h);
    return ()=>document.removeEventListener("mousedown",h);
  },[open]);
  const filtered=(staffList||[])
    .filter(s=>!q || s.name.toLowerCase().includes(q.toLowerCase()) || (s.username||"").toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name,"vi"));
  const pad = size==="sm" ? "5px 8px" : "7px 10px";
  const fs  = size==="sm" ? 11 : 12;
  return (
    <div ref={ref} style={{position:"relative",width:"100%"}}>
      <input value={q} onChange={e=>{setQ(e.target.value); setOpen(true);}} onFocus={()=>setOpen(true)}
        placeholder={placeholder}
        style={{width:"100%",padding:pad,border:`1px dashed ${accent}66`,borderRadius:6,fontSize:fs,background:"#fff",color:"var(--text)",outline:"none"}}/>
      {open && (
        <div style={{position:"absolute",top:"calc(100% + 3px)",left:0,right:0,minWidth:160,background:"#fff",border:"1px solid var(--bd)",borderRadius:6,boxShadow:"var(--sh-lg)",zIndex:60,maxHeight:220,overflowY:"auto"}}>
          {filtered.length===0 && <div style={{padding:10,color:"var(--mut)",fontSize:11,textAlign:"center"}}>Không tìm thấy</div>}
          {filtered.map(s=>{
            const [tc,bg]=(s.isAdmin?RC.admin:["#64748B","#F1F5F9"]);
            return (
              <div key={s.id} onClick={()=>{onPick(s.id); setOpen(false); setQ("");}}
                style={{padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",gap:7,fontSize:11.5,borderBottom:"1px solid var(--bd2)"}}
                onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                <div style={{width:22,height:22,borderRadius:"50%",background:bg,color:tc,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,flexShrink:0}}>{inits(s.name)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div>
                  <div style={{fontSize:9.5,color:tc,fontWeight:600}}>{(s.isAdmin?"Admin":"Thành viên")}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function KpiPicker({staff,value,onChange,inShiftIds,inp}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState("");
  const ref=useRef(null);
  const selected=staff.find(s=>s.id===value);
  const isOutShift=selected && !inShiftIds.has(selected.id);

  useEffect(()=>{
    if(!open) return;
    const h=e=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",h);
    return ()=>document.removeEventListener("mousedown",h);
  },[open]);

  const filtered=staff
    .filter(s=>s.active && (!q || s.name.toLowerCase().includes(q.toLowerCase())))
    .sort((a,b)=>{
      const ai=inShiftIds.has(a.id), bi=inShiftIds.has(b.id);
      if(ai!==bi) return ai?-1:1;
      return a.name.localeCompare(b.name,"vi");
    });

  return (
    <div ref={ref} style={{position:"relative"}}>
      <button onClick={()=>setOpen(o=>!o)} type="button"
        style={{...inp,padding:"8px 9px",border:`1.5px solid ${isOutShift?"#DC2626":(value!==undefined?"var(--or)":"var(--bd)")}`,background:isOutShift?"#FEF2F2":"var(--orl)",cursor:"pointer",fontWeight:600,fontSize:11.5,color:isOutShift?"#DC2626":"var(--or)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,textAlign:"left"}}>
        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {selected ? selected.name : "Chọn KPI..."}
          {isOutShift && <span style={{fontSize:9,marginLeft:5,padding:"1px 5px",background:"#fff",color:"#DC2626",borderRadius:"var(--r-pill)",fontWeight:800}}>ngoài ca</span>}
        </span>
        <i className="ti ti-chevron-down" style={{fontSize:13,flexShrink:0}}/>
      </button>
      {open && (
        <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#fff",border:"1px solid var(--bd)",borderRadius:"var(--r-md)",boxShadow:"var(--sh-lg)",zIndex:50,maxHeight:280,display:"flex",flexDirection:"column"}}>
          <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Tìm tên..."
            style={{padding:"8px 10px",border:"none",borderBottom:"1px solid var(--bd2)",fontSize:12,outline:"none"}}/>
          <div style={{overflowY:"auto",flex:1}}>
            {filtered.length===0 && <div style={{padding:14,color:"var(--mut)",fontSize:11.5,textAlign:"center"}}>Không tìm thấy</div>}
            {filtered.map(s=>{
              const out=!inShiftIds.has(s.id);
              return (
                <div key={s.id} onClick={()=>{onChange(s.id);setOpen(false);setQ("");}}
                  style={{padding:"8px 10px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,borderBottom:"1px solid var(--bd2)",background:s.id===value?"var(--orl)":"#fff"}}
                  onMouseEnter={e=>{if(s.id!==value)e.currentTarget.style.background="#FAFAFA"}}
                  onMouseLeave={e=>{if(s.id!==value)e.currentTarget.style.background="#fff"}}>
                  <span><b>{s.name}</b>{s.isAdmin && <small style={{color:"var(--mut)"}}> · Admin</small>}</span>
                  {out && <span style={{fontSize:9,padding:"1px 6px",background:"#FEF2F2",color:"#DC2626",borderRadius:"var(--r-pill)",fontWeight:700}}>ngoài ca</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   CONFIRM DIALOG (Big Update) — pop-up xác nhận hành động
══════════════════════════════════════════════════════════ */
function ConfirmDialog({title,message,detail,confirmLabel="Xác nhận",cancelLabel="Quay lại",danger=false,icon="⚠️",onConfirm,onClose}){
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:1100,display:"flex",alignItems:"center",justifyContent:"center",padding:20,animation:"fadeIn .15s"}}>
      <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:380,padding:"20px 20px 16px",animation:"fadeUp .2s ease",textAlign:"center"}}>
        <div style={{fontSize:38,marginBottom:8}}>{icon}</div>
        <div style={{fontSize:16,fontWeight:800,color:"var(--text)",marginBottom:6}}>{title}</div>
        {message && <div style={{fontSize:12.5,color:"var(--mut)",lineHeight:1.55,marginBottom:detail?10:4}}>{message}</div>}
        {detail && <div style={{fontSize:12,color:"var(--text2)",background:"#FAFAFA",border:"1px solid var(--bd2)",borderRadius:"var(--r-sm)",padding:"9px 11px",marginBottom:6,textAlign:"left"}}>{detail}</div>}
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button onClick={onClose} style={{flex:1,padding:"11px",border:"1px solid var(--bd)",background:"#fff",borderRadius:"var(--r-md)",cursor:"pointer",fontSize:13,fontWeight:600,color:"var(--text2)"}}>{cancelLabel}</button>
          <button onClick={onConfirm} autoFocus
            style={{flex:1.4,padding:"11px",border:"none",borderRadius:"var(--r-md)",fontSize:13.5,fontWeight:800,cursor:"pointer",color:"#fff",background:danger?"linear-gradient(135deg,#EF4444,#B91C1C)":"linear-gradient(135deg,var(--or),var(--ord))"}}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   EDIT ORDER MODAL (Big Update) — sửa đơn SAU KHI đã chốt
   Quyền: trưởng ca / trực đơn / admin. Hiển thị dạng pop-up.
   Tự đối soát kho theo chênh lệch số lượng khi lưu.
══════════════════════════════════════════════════════════ */
function EditOrderModal({order,products,categories,zones,pickupLocs=[],staff,currentUser,shiftAssignments=[],currentShift=null,onClose,onSave}){
  const cats = categories.length ? categories : Object.keys(CL_FALLBACK).map((k,i)=>({key:k,label:CL_FALLBACK[k],sort:i}));
  // zone index khớp với phí ship hiện tại (đơn lưu dFee, không lưu index)
  const zoneIdx0 = order.type==="ship" ? Math.max(0, zones.findIndex(z=>z.fee===order.dFee)) : 0;
  const [d,setD] = useState(()=>({
    cus:order.cus||"", ph:order.ph||"", type:order.type||"tai_cho", adr:order.adr||"",
    zone: zoneIdx0===-1?0:zoneIdx0,
    kpi:order.kpi, pay:order.pay||"cash",
    // disc của đơn cũ lưu là SỐ TIỀN tuyệt đối → hiển thị/sửa dạng "đ" (fixed)
    dT:"fixed", disc:order.disc||0, note:order.note||"",
    items:(order.items||[]).map(i=>({...i})), schA:order.schA||"", schD:order.schD||"",
    pickupId:(order.pickupId??null),
  }));
  const [cat,setCat]=useState(cats[0]?.key||"pha_che");
  const [search,setSrch]=useState("");
  const [noteFor,setNoteFor]=useState(null);

  const sub   = d.items.reduce((s,i)=>s+i.p*i.qty,0);
  const dFee  = d.type==="ship" ? (zones[d.zone]||{fee:0}).fee : 0;
  const discAmt = d.dT==="pct" ? Math.round(sub*Math.min(Math.max(d.disc||0,0),100)/100) : Math.min(Math.max(d.disc||0,0),sub);
  const total = sub+dFee-discAmt;

  const stockOf = pid => { const p=products.find(x=>x.id===pid); return p?p.stock:0; };
  const origQty = pid => (order.items.find(i=>i.pid===pid)||{qty:0}).qty;
  // kho khả dụng cho 1 sp khi sửa = stock hiện tại + đã trừ cho đơn này (origQty)
  const availFor = pid => stockOf(pid) + origQty(pid);

  const visible = products.filter(p=>p.on!==false);
  const filtered= visible.filter(p=>p.cat===cat&&(!search||p.name.toLowerCase().includes(search.toLowerCase())));
  const cqty = pid => (d.items.find(i=>i.pid===pid)||{qty:0}).qty;

  const setQty=(pid,q)=>{
    const max=availFor(pid);
    if(q>max) q=max;
    if(q<=0) setD(s=>({...s,items:s.items.filter(i=>i.pid!==pid)}));
    else     setD(s=>({...s,items:s.items.map(i=>i.pid===pid?{...i,qty:q}:i)}));
  };
  const addItem=p=>{
    if(availFor(p.id)<=cqty(p.id)) return;
    setD(s=>{const ex=s.items.find(i=>i.pid===p.id);return ex?{...s,items:s.items.map(i=>i.pid===p.id?{...i,qty:i.qty+1}:i)}:{...s,items:[...s.items,{pid:p.id,name:p.name,p:p.price,qty:1,note:""}]};});
  };
  const setNote=(pid,note)=>setD(s=>({...s,items:s.items.map(i=>i.pid===pid?{...i,note}:i)}));

  const save=()=>{
    if(!d.cus.trim()) return;
    if(!d.items.length) return;
    const updated={...order, cus:d.cus.trim(), ph:d.ph, type:d.type,
      adr:d.type==="ship"?d.adr:"", items:d.items.map(i=>({...i})),
      pay:d.pay, dFee, disc:discAmt, dT:d.dT, kpi:d.kpi, note:d.note,
      pickupId:(d.pickupId??null),
      // đổi sang "tại chỗ" → bỏ shipper + hẹn giao
      sid:d.type==="ship"?order.sid:null,
      schA:d.type==="ship"?(d.schA||""):"", schD:d.type==="ship"&&d.schA?(d.schD||todayISO()):""};
    onSave(order, updated);
  };

  const lbl={fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:600,textTransform:"uppercase",letterSpacing:.3};
  const inp={width:"100%",padding:"8px 11px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:12.5,background:"#fff"};

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,animation:"fadeIn .15s"}}>
      <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:520,maxHeight:"92vh",display:"flex",flexDirection:"column",animation:"fadeUp .2s ease",overflow:"hidden"}}>
        {/* header */}
        <div style={{padding:"13px 16px",borderBottom:"1px solid var(--bd)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"linear-gradient(180deg,#fff,#FAFAFA)",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:15,fontWeight:800,color:"var(--text)"}}>✏️ Sửa đơn</span>
            <span style={{fontFamily:"ui-monospace,monospace",fontSize:13,fontWeight:800,color:"var(--or)"}}>{order.id}</span>
            <Bdg s={order.st}/>
          </div>
          <button onClick={onClose} style={{background:"#f0f0f0",border:"none",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:14,color:"var(--mut)"}}>✕</button>
        </div>

        {/* body scroll */}
        <div style={{flex:1,overflowY:"auto",padding:"14px 16px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 130px",gap:8,marginBottom:9}}>
            <div><div style={lbl}>Khách hàng *</div>
              <input value={d.cus} onChange={e=>setD(s=>({...s,cus:e.target.value}))} style={inp}/></div>
            <div><div style={lbl}>SĐT</div>
              <input value={d.ph} onChange={e=>setD(s=>({...s,ph:e.target.value}))} style={inp} inputMode="tel"/></div>
          </div>
          <div style={{marginBottom:9}}>
            <div style={lbl}>Người nhận KPI</div>
            <KpiPicker staff={staff} value={d.kpi} onChange={id=>setD(s=>({...s,kpi:id}))}
              inShiftIds={new Set(shiftAssignments.filter(a=>a.shift_id===currentShift?.id && a.role!=="off").map(a=>a.staff_id))} inp={inp}/>
          </div>
          <div style={{marginBottom:9}}>
            <div style={lbl}>Loại đơn</div>
            <div style={{display:"flex",gap:6}}>
              {[["tai_cho","🏠","Tại chỗ"],["ship","🛵","Ship"]].map(([v,e,l])=>(
                <button key={v} onClick={()=>setD(s=>({...s,type:v}))}
                  style={{flex:1,padding:"8px 4px",border:`1.5px solid ${d.type===v?"var(--or)":"var(--bd)"}`,borderRadius:"var(--r-sm)",cursor:"pointer",background:d.type===v?"var(--orl)":"#fff",color:d.type===v?"var(--or)":"var(--text2)",fontSize:12,fontWeight:d.type===v?700:500}}>{e} {l}</button>
              ))}
            </div>
          </div>
          {pickupLocs.length>0 && (
            <div style={{marginBottom:9}}>
              <div style={lbl}>🏭 Điểm lấy hàng</div>
              <select value={d.pickupId??""} onChange={e=>setD(s=>({...s,pickupId:e.target.value?+e.target.value:null}))}
                style={{...inp,cursor:"pointer",fontWeight:600}}>
                <option value="">— Không chọn —</option>
                {pickupLocs.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
          )}
          {d.type==="ship" && (
            <div style={{marginBottom:9,paddingTop:8,borderTop:"1px dashed var(--bd)"}}>
              <div style={lbl}>📍 Địa chỉ giao</div>
              <input value={d.adr} onChange={e=>setD(s=>({...s,adr:e.target.value}))} style={{...inp,marginBottom:6}}/>
              <div style={lbl}>Phí ship</div>
              <div style={{display:"flex",gap:5,marginBottom:8}}>
                {zones.map((z,i)=>(
                  <button key={i} onClick={()=>setD(s=>({...s,zone:i}))}
                    style={{flex:1,padding:"7px 4px",border:`1.5px solid ${d.zone===i?"var(--or)":"var(--bd)"}`,borderRadius:"var(--r-sm)",cursor:"pointer",background:d.zone===i?"var(--orl)":"#fff",fontSize:10.5,textAlign:"center"}}>
                    <div style={{fontWeight:800,color:d.zone===i?"var(--or)":"var(--text)"}}>{fmt(z.fee)}</div>
                    <div style={{fontSize:9.5,color:"var(--mut2)"}}>{z.lb}</div></button>
                ))}
              </div>
              <div style={lbl}><i className="ti ti-clock-hour-4" style={{fontSize:11,marginRight:3}}/>Hẹn giao (tùy chọn)</div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="date" value={d.schD} min={todayISO()} onChange={e=>setD(s=>({...s,schD:e.target.value}))} style={{...inp,padding:"7px 10px",flex:1.3}}/>
                <Time24 value={d.schA} onChange={v=>setD(s=>({...s,schA:v}))} style={{flex:1}}/>
                {(d.schA||d.schD) && <button onClick={()=>setD(s=>({...s,schA:"",schD:""}))} style={{padding:"7px 10px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",background:"#fff",cursor:"pointer",fontSize:11,color:"var(--mut)"}}>✕</button>}
              </div>
            </div>
          )}

          {/* danh sách món hiện tại */}
          <div style={{marginTop:6,marginBottom:8}}>
            <div style={lbl}>🛒 Món trong đơn ({d.items.reduce((s,i)=>s+i.qty,0)})</div>
            {d.items.length===0 && <div style={{textAlign:"center",padding:"12px 0",color:"var(--mut2)",fontSize:11.5}}>Giỏ trống — thêm món bên dưới</div>}
            {d.items.map(i=>(
              <div key={i.pid} style={{padding:"7px 0",borderBottom:"1px dashed var(--bd2)"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{flex:1,fontSize:12,fontWeight:600,color:"var(--text)"}}>{i.name}</span>
                  <Qty val={i.qty} onInc={()=>setQty(i.pid,i.qty+1)} onDec={()=>setQty(i.pid,i.qty-1)} min={1} max={availFor(i.pid)} sm/>
                  <span style={{fontSize:11.5,color:"var(--or)",minWidth:64,textAlign:"right",fontWeight:700}}>{fmt(i.p*i.qty)}</span>
                  <button onClick={()=>setQty(i.pid,0)} aria-label="Xoá" style={{background:"transparent",border:"none",cursor:"pointer",color:"var(--mut2)",fontSize:14,padding:2}}><i className="ti ti-trash"/></button>
                </div>
                {noteFor===i.pid
                  ? <input autoFocus value={i.note||""} onChange={e=>setNote(i.pid,e.target.value)} onBlur={()=>setNoteFor(null)} placeholder="VD: ít đường..." style={{...inp,padding:"5px 9px",fontSize:11,marginTop:5}}/>
                  : <button onClick={()=>setNoteFor(i.pid)} style={{fontSize:10.5,color:i.note?"var(--or)":"var(--mut2)",background:"none",border:"none",cursor:"pointer",paddingLeft:0,marginTop:3,fontWeight:i.note?600:500}}>{i.note?`📝 ${i.note}`:"+ Ghi chú món"}</button>}
              </div>
            ))}
          </div>

          {/* thêm món */}
          <details style={{marginBottom:8}}>
            <summary style={{cursor:"pointer",fontSize:11.5,fontWeight:700,color:"var(--or)",padding:"6px 0"}}>＋ Thêm sản phẩm</summary>
            <input value={search} onChange={e=>setSrch(e.target.value)} placeholder="Tìm sản phẩm..." style={{...inp,margin:"6px 0"}}/>
            <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:4,marginBottom:6}}>
              {cats.map(c=>(
                <button key={c.key} onClick={()=>setCat(c.key)} style={{flexShrink:0,fontSize:10.5,padding:"5px 11px",border:`1.5px solid ${cat===c.key?"var(--or)":"var(--bd)"}`,borderRadius:"var(--r-pill)",cursor:"pointer",background:cat===c.key?"var(--or)":"#fff",color:cat===c.key?"#fff":"var(--text2)",fontWeight:cat===c.key?700:500,whiteSpace:"nowrap"}}>{c.label}</button>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:6}}>
              {filtered.map(p=>{const q=cqty(p.id);const left=availFor(p.id)-q;return (
                <button key={p.id} onClick={()=>addItem(p)} disabled={left<=0}
                  style={{textAlign:"left",border:`1.5px solid ${q>0?"var(--or)":"var(--bd2)"}`,borderRadius:"var(--r-sm)",padding:"7px 8px",background:q>0?"var(--orl)":"#fff",cursor:left<=0?"not-allowed":"pointer",opacity:left<=0?.5:1}}>
                  <div style={{fontSize:11,fontWeight:600,color:"var(--text)",lineHeight:1.3}}>{p.emoji} {p.name}</div>
                  <div style={{fontSize:11,color:"var(--or)",fontWeight:700,marginTop:2}}>{fmt(p.price)} <span style={{color:"var(--mut2)",fontWeight:500}}>· còn {left}</span></div>
                </button>
              );})}
            </div>
          </details>

          {/* giảm giá + thanh toán */}
          <div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}>
            <select value={d.dT} onChange={e=>setD(s=>({...s,dT:e.target.value,disc:0}))} style={{width:110,padding:"7px 9px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:11,background:"#fff",cursor:"pointer",fontWeight:600}}>
              <option value="fixed">Giảm (đ)</option><option value="pct">Giảm (%)</option>
            </select>
            <input type="number" min={0} value={d.disc||""} onChange={e=>setD(s=>({...s,disc:+e.target.value}))} placeholder={d.dT==="pct"?"10":"0"} style={{flex:1,padding:"7px 10px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:12}}/>
            {discAmt>0 && <span className="chip" style={{background:"var(--ok-bg)",color:"var(--ok)",fontSize:11}}>−{fmt(discAmt)}</span>}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:8}}>
            {[["cash","💵","Tiền mặt"],["qr","📱","VietQR"]].map(([v,e,l])=>(
              <button key={v} onClick={()=>setD(s=>({...s,pay:v}))} style={{flex:1,padding:"7px 4px",border:`1.5px solid ${d.pay===v?"var(--ok)":"var(--bd)"}`,borderRadius:"var(--r-sm)",cursor:"pointer",background:d.pay===v?"var(--ok-bg)":"#fff",color:d.pay===v?"var(--ok)":"var(--text2)",fontSize:11.5,fontWeight:d.pay===v?700:500}}>{e} {l}</button>
            ))}
          </div>
          <input value={d.note||""} onChange={e=>setD(s=>({...s,note:e.target.value}))} placeholder="📝 Ghi chú đơn..." style={{...inp,fontSize:11.5}}/>
        </div>

        {/* footer */}
        <div style={{padding:"11px 16px",borderTop:"1px solid var(--bd)",background:"#fff",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,fontSize:12}}>
            <span style={{color:"var(--mut)"}}>{d.items.reduce((s,i)=>s+i.qty,0)} món · {d.type==="ship"?"Ship":"Tại chỗ"}</span>
            <span style={{color:"var(--text2)"}}>Tổng <strong style={{color:"var(--or)",fontSize:15,marginLeft:4}}>{fmt(total)}</strong></span>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={onClose} style={{flex:1,padding:"11px",border:"1px solid var(--bd)",background:"#fff",borderRadius:"var(--r-md)",cursor:"pointer",fontSize:13,fontWeight:600,color:"var(--text2)"}}>Huỷ bỏ</button>
            <button onClick={save} disabled={!d.items.length||!d.cus.trim()} className={d.items.length&&d.cus.trim()?"btn-pri-grad":""}
              style={{flex:2,padding:"11px",border:"none",borderRadius:"var(--r-md)",fontSize:13.5,fontWeight:800,cursor:d.items.length&&d.cus.trim()?"pointer":"not-allowed",background:d.items.length&&d.cus.trim()?"":"#e5e5e5",color:d.items.length&&d.cus.trim()?"":"#999",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
              <i className="ti ti-device-floppy" style={{fontSize:16}}/>Lưu thay đổi
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function OrderScreen({orders,setOrders,products,setProducts,staff,currentUser,effectiveRole,zones,pickupLocs=[],categories,toast,shiftAssignments=[],currentShift=null,deleteOrder=null}){
  const isAdmin = currentUser?.isAdmin === true;
  const erole = effectiveRole || currentUser?.isAdmin && "admin" || "off";
  const canEditOrder = ["truong_ca","truc_don","admin"].includes(erole);
  const [editId,setEditId] = useState(null);
  const [cancelId,setCancelId] = useState(null);
  const [q,setQ] = useState("");            // v1.15: tìm đơn đang xử lý
  const [stFilter,setStFilter] = useState("all"); // v1.15: lọc theo trạng thái
  const EC = {cus:"",ph:"",type:"tai_cho",adr:"",zone:0,kpi:currentUser.id,pay:"cash",disc:0,dT:"fixed",note:"",items:[],schA:"",schD:"",pickupId:(pickupLocs[0]?.id??null)};
  const cats = categories.length ? categories : Object.keys(CL_FALLBACK).map((k,i)=>({key:k,label:CL_FALLBACK[k],sort:i}));
  const [cat,setCat]   = useState(cats[0]?.key || "pha_che");
  const [cart,setCart] = useState({...EC});
  const [search,setSrch]= useState("");
  const [noteFor,setNoteFor]= useState(null);
  const noteRef = useRef(null);

  // Reset KPI default when user changes
  useEffect(()=>{ setCart(c=>({...c,kpi:currentUser.id})); },[currentUser.id]);

  const sub     = cart.items.reduce((s,i)=>s+i.p*i.qty,0);
  const dFee    = cart.type==="ship"?(zones[cart.zone]||{fee:8000}).fee:0;
  const discAmt = cart.dT==="pct"?Math.round(sub*Math.min(Math.max(cart.disc||0,0),100)/100):Math.min(Math.max(cart.disc||0,0),sub);
  const total   = sub+dFee-discAmt;

  const visible = products.filter(p=>p.on!==false);
  const filtered= visible.filter(p=>p.cat===cat&&(!search||p.name.toLowerCase().includes(search.toLowerCase())));
  const cqty    = pid => (cart.items.find(i=>i.pid===pid)||{qty:0}).qty;

  const addItem=p=>{
    if(p.stock===0){toast("Sản phẩm đã hết hàng","warn");return;}
    setCart(c=>{const ex=c.items.find(i=>i.pid===p.id);return ex?{...c,items:c.items.map(i=>i.pid===p.id?{...i,qty:i.qty+1}:i)}:{...c,items:[...c.items,{pid:p.id,name:p.name,p:p.price,qty:1,note:""}]};});
  };
  const setQty=(pid,q)=>{
    if(q<=0) setCart(c=>({...c,items:c.items.filter(i=>i.pid!==pid)}));
    else     setCart(c=>({...c,items:c.items.map(i=>i.pid===pid?{...i,qty:q}:i)}));
  };
  const setNote=(pid,note)=>setCart(c=>({...c,items:c.items.map(i=>i.pid===pid?{...i,note}:i)}));

  const create=()=>{
    if(!cart.cus.trim()){toast("Vui lòng nhập tên khách hàng","warn");return;}
    if(!cart.items.length){toast("Giỏ hàng đang trống","warn");return;}
    const num = (orders.length ? Math.max(...orders.map(o=>o.num||0)) : 0) + 1;
    const id  = `ĐH${String(num).padStart(3,"0")}`;
    const o={id,num,t:nowS(),cus:cart.cus.trim(),ph:cart.ph,type:cart.type,adr:cart.adr,items:cart.items.map(i=>({...i})),st:(cart.schA?"pre_order":"moi"),pay:cart.pay,dFee,disc:discAmt,dT:cart.dT,by:currentUser.id,kpi:cart.kpi,sid:null,note:cart.note,schA:cart.schA||"",schD:cart.schA?(cart.schD||todayISO()):"",pickupId:(cart.pickupId??null)};
    setProducts(ps=>ps.map(p=>{const ci=cart.items.find(i=>i.pid===p.id);return ci?{...p,stock:Math.max(0,p.stock-ci.qty)}:p;}));
    setOrders(os=>[...os,o]);
    setCart({...EC,kpi:currentUser.id});
    toast(cart.schA?`📋 Đơn đặt trước ${id} · hẹn ${schedLabel(o)} · vào mục Đặt trước`:`✅ Đơn ${id} tạo thành công · ${fmt(total)}`,"success");
  };

  const cancel=id=>{
    const o = orders.find(x=>x.id===id);
    if(!o) return;
    // Chỉ hoàn kho cho đơn chưa kết thúc (tránh hoàn 2 lần)
    if(!["huy","hoan_thanh","hoan_hang"].includes(o.st)){
      setProducts(ps=>ps.map(p=>{const ci=o.items.find(i=>i.pid===p.id);return ci?{...p,stock:p.stock+ci.qty}:p;}));
    }
    setOrders(os=>os.map(x=>x.id===id?{...x,st:"huy"}:x));
    toast("Đã huỷ đơn · đã hoàn kho","warn");
  };
  // Big Update: lưu sửa đơn đã chốt — đối soát kho theo chênh lệch số lượng
  const saveEdit=(oldO,newO)=>{
    setProducts(ps=>ps.map(p=>{
      const oq=(oldO.items.find(i=>i.pid===p.id)||{qty:0}).qty;
      const nq=(newO.items.find(i=>i.pid===p.id)||{qty:0}).qty;
      const delta=nq-oq; // >0 cần trừ thêm kho, <0 hoàn kho
      return delta ? {...p,stock:Math.max(0,p.stock-delta)} : p;
    }));
    setOrders(os=>os.map(x=>x.id===newO.id?newO:x));
    setEditId(null);
    toast(`✅ Đã cập nhật đơn ${newO.id}`,"success");
  };
  const editOrder = editId ? orders.find(o=>o.id===editId) : null;
  const cancelOrder = cancelId ? orders.find(o=>o.id===cancelId) : null;
  const active=orders.filter(o=>!["hoan_thanh","huy","cho_xac_nhan","pre_order"].includes(o.st));
  // v1.5: đơn khách tự đặt chờ duyệt
  const pendingApproval = orders.filter(o=>o.st==="cho_xac_nhan").sort((a,b)=>a.num-b.num);
  // v1.14: đơn ĐẶT TRƯỚC (pre-order) — sắp theo giờ hẹn gần → xa. Chỉ vào bếp khi trực đơn xác nhận.
  const [nowTick,setNowTick] = useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNowTick(new Date()),60000);return()=>clearInterval(t);},[]);
  const preOrders = orders.filter(o=>o.st==="pre_order")
    .sort((a,b)=>((minsToDeadline(a,nowTick)??1e9)-(minsToDeadline(b,nowTick)??1e9)));
  // Nhắc trực đơn khi đơn đặt trước sắp tới giờ (1 lần/đơn)
  const preRemind = useRef(new Set());
  useEffect(()=>{
    preOrders.forEach(o=>{
      const dl = minsToDeadline(o, nowTick);
      if(dl===null) return;
      if(dl<=REMIND_LEAD && dl>-180 && !preRemind.current.has(o.id)){
        preRemind.current.add(o.id);
        toast(`📋 Đơn đặt trước ${o.id} ${dl>=0?`còn ${dl} phút`:`ĐÃ TRỄ ${-dl} phút`} — cân nhắc đưa vào pha (hẹn ${schedLabel(o)})`, dl<0?"error":"warn");
      } else if(dl>REMIND_LEAD && preRemind.current.has(o.id)){
        preRemind.current.delete(o.id);
      }
    });
  },[nowTick]);// eslint-disable-line
  // Đưa đơn đặt trước vào bếp (mục "cần pha" = Đơn mới của KDS)
  const releaseToKitchen = oid => {
    setOrders(os=>os.map(x=>x.id===oid?{...x,st:"moi"}:x));
    toast(`▶ Đơn ${oid} đã đưa vào pha`,"success");
  };
  // v1.15: lọc + tìm kiếm đơn đang xử lý (giảm sót đơn khi số lượng lớn)
  const ACTIVE_ST = ["moi","pha_che","san_sang","da_lay","dang_giao"];
  const qn = q.trim().toLowerCase();
  const activeFiltered = active.filter(o=>{
    if (stFilter!=="all" && o.st!==stFilter) return false;
    if (!qn) return true;
    return (o.id||"").toLowerCase().includes(qn) || (o.cus||"").toLowerCase().includes(qn) || (o.ph||"").toLowerCase().includes(qn);
  });

  // Duyệt đơn khách: trừ kho + gán KPI + chuyển sang 'moi'
  const approveCustomer = (oid) => {
    const o = orders.find(x=>x.id===oid);
    if(!o) return;
    // Check stock đủ không
    const insufficient = o.items.find(i=>{
      const p = products.find(x=>x.id===i.pid);
      return !p || p.stock < i.qty;
    });
    if (insufficient) {
      const p = products.find(x=>x.id===insufficient.pid);
      toast(`Không đủ kho: ${insufficient.name} (cần ${insufficient.qty}, còn ${p?.stock||0})`, "error");
      return;
    }
    setProducts(ps=>ps.map(p=>{const ci=o.items.find(i=>i.pid===p.id);return ci?{...p,stock:Math.max(0,p.stock-ci.qty)}:p;}));
    setOrders(os=>os.map(x=>x.id===oid?{...x,st:"moi",by:currentUser.id,kpi:currentUser.id}:x));
    toast(`✓ Duyệt đơn ${oid} · KPI về bạn`, "success");
  };
  const rejectCustomer = (oid) => {
    const reason = prompt("Lý do từ chối đơn (ngắn gọn):");
    if (!reason || !reason.trim()) return;
    setOrders(os=>os.map(x=>x.id===oid?{...x,st:"huy",returnReason:`Từ chối: ${reason.trim()}`}:x));
    toast(`Đã từ chối đơn ${oid}`, "warn");
  };

  useEffect(()=>{if(noteFor&&noteRef.current)noteRef.current.focus();},[noteFor]);

  const itemCount = cart.items.reduce((s,i)=>s+i.qty,0);
  const lbl = {fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:600,textTransform:"uppercase",letterSpacing:.3};
  const inp = {width:"100%",padding:"8px 11px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:12.5,background:"#fff"};

  return (
    <div className="order-shell">
      <div className="order-left">
        <div className="order-scroll" style={{flex:1,minHeight:0,overflowY:"auto",display:"flex",flexDirection:"column"}}>

        <div style={{padding:"12px 14px 10px",borderBottom:"1px solid var(--bd2)",flexShrink:0,background:"linear-gradient(180deg,#fff 0%,#FAFAFA 100%)"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 130px",gap:8,marginBottom:9}}>
            <div>
              <div style={lbl}>Khách hàng *</div>
              <input value={cart.cus} onChange={e=>setCart(c=>({...c,cus:e.target.value}))} placeholder="Tên khách..." style={inp}/>
            </div>
            <div>
              <div style={lbl}>SĐT</div>
              <input value={cart.ph||""} onChange={e=>setCart(c=>({...c,ph:e.target.value}))} placeholder="09xx..." style={inp} inputMode="tel"/>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:9}}>
            <div>
              <div style={lbl}><i className="ti ti-user" style={{fontSize:11,marginRight:3}}/>Người tạo</div>
              <div style={{padding:"8px 11px",background:"#F3F4F6",borderRadius:"var(--r-sm)",fontSize:12,color:"var(--text2)",fontWeight:600,border:"1px solid var(--bd2)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{currentUser.name}</div>
            </div>
            <div>
              <div style={{...lbl,color:"var(--or)"}}><i className="ti ti-target" style={{fontSize:11,marginRight:3}}/>Người nhận KPI</div>
              <KpiPicker staff={staff} value={cart.kpi}
                onChange={id=>setCart(c=>({...c,kpi:id}))}
                inShiftIds={new Set(shiftAssignments.filter(a=>a.shift_id===currentShift?.id && a.role!=="off").map(a=>a.staff_id))}
                inp={inp}/>
            </div>
          </div>
          <div>
            <div style={lbl}>Loại đơn</div>
            <div style={{display:"flex",gap:6}}>
              {[["tai_cho","🏠","Tại chỗ"],["ship","🛵","Ship"]].map(([v,e,l])=>(
                <button key={v} onClick={()=>setCart(c=>({...c,type:v}))}
                  style={{flex:1,padding:"9px 4px",border:`1.5px solid ${cart.type===v?"var(--or)":"var(--bd)"}`,borderRadius:"var(--r-sm)",cursor:"pointer",background:cart.type===v?"var(--orl)":"#fff",color:cart.type===v?"var(--or)":"var(--text2)",fontSize:12,fontWeight:cart.type===v?700:500,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><span style={{fontSize:14}}>{e}</span>{l}</button>
              ))}
            </div>
          </div>
          {pickupLocs.length>0 && (
            <div style={{marginTop:9}}>
              <div style={lbl}>🏭 Điểm lấy hàng</div>
              <select value={cart.pickupId??""} onChange={e=>setCart(c=>({...c,pickupId:e.target.value?+e.target.value:null}))}
                style={{...inp,cursor:"pointer",fontWeight:600}}>
                <option value="">— Không chọn —</option>
                {pickupLocs.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
          )}
          {cart.type==="ship"&&(
            <div style={{marginTop:10,paddingTop:10,borderTop:"1px dashed var(--bd)"}}>
              <div style={lbl}>📍 Địa chỉ giao hàng</div>
              <input value={cart.adr} onChange={e=>setCart(c=>({...c,adr:e.target.value}))} placeholder="Tòa nhà, phòng số..." style={{...inp,marginBottom:6}}/>
              <div style={{display:"flex",gap:5,marginBottom:9,flexWrap:"wrap"}}>
                {["Tòa A","Tòa B","Tòa C","KTX C1","KTX D2","Thư viện"].map(t=>(
                  <button key={t} onClick={()=>setCart(c=>({...c,adr:c.adr?c.adr+", "+t:t}))} className="btn-ghost"
                    style={{fontSize:10.5,padding:"4px 9px",borderRadius:"var(--r-pill)"}}>+ {t}</button>
                ))}
              </div>
              <div style={lbl}>Phí ship</div>
              <div style={{display:"flex",gap:5}}>
                {zones.map((z,i)=>(
                  <button key={i} onClick={()=>setCart(c=>({...c,zone:i}))}
                    style={{flex:1,padding:"8px 4px",border:`1.5px solid ${cart.zone===i?"var(--or)":"var(--bd)"}`,borderRadius:"var(--r-sm)",cursor:"pointer",background:cart.zone===i?"var(--orl)":"#fff",fontSize:10.5,lineHeight:1.4,textAlign:"center"}}>
                    <div style={{fontWeight:800,color:cart.zone===i?"var(--or)":"var(--text)",fontSize:11.5}}>{fmt(z.fee)}</div>
                    <div style={{fontSize:9.5,color:cart.zone===i?"var(--or)":"var(--mut2)",marginTop:1}}>{z.lb}</div>
                  </button>
                ))}
              </div>
              {/* v1.9.5: hẹn ngày + giờ giao */}
              <div style={{marginTop:10,paddingTop:8,borderTop:"1px dashed var(--bd2)"}}>
                <div style={lbl}><i className="ti ti-clock-hour-4" style={{fontSize:11,marginRight:3}}/>Hẹn giao (tùy chọn)</div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <input type="date" value={cart.schD} min={todayISO()} onChange={e=>setCart(c=>({...c,schD:e.target.value}))}
                    style={{...inp,padding:"7px 10px",flex:1.3}} title="Ngày giao"/>
                  <Time24 value={cart.schA} onChange={v=>setCart(c=>({...c,schA:v}))} style={{flex:1}}/>
                  {(cart.schA||cart.schD) && (
                    <button onClick={()=>setCart(c=>({...c,schA:"",schD:""}))} title="Xoá hẹn giao"
                      style={{padding:"7px 10px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",background:"#fff",cursor:"pointer",fontSize:11,color:"var(--mut)"}}>✕</button>
                  )}
                </div>
                {cart.schA
                  ? <div style={{fontSize:10.5,color:"var(--or)",marginTop:4,fontWeight:600}}>⏰ Hẹn giao <b>{cart.schA}</b> · {cart.schD?`${isoWeekday(cart.schD)} ${isoToVN(cart.schD)}`:"hôm nay"} · 📋 vào mục <b>Đặt trước</b>, chưa pha cho tới khi bạn xác nhận</div>
                  : (cart.schD && <div style={{fontSize:10.5,color:"var(--warn)",marginTop:4,fontWeight:600}}>⚠ Đã chọn ngày nhưng chưa chọn <b>giờ giao</b> — cần giờ để bật nhắc nhở</div>)
                }
              </div>
            </div>
          )}
        </div>

        <div style={{padding:"10px 14px 8px",borderBottom:"1px solid var(--bd2)",flexShrink:0,background:"#fff",position:"sticky",top:0,zIndex:5,boxShadow:"0 2px 4px rgba(0,0,0,.03)"}}>
          <div style={{position:"relative",marginBottom:8}}>
            <i className="ti ti-search" style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"var(--mut2)",fontSize:14,pointerEvents:"none"}}/>
            <input value={search} onChange={e=>setSrch(e.target.value)} placeholder="Tìm sản phẩm..."
              style={{...inp,padding:"8px 32px 8px 32px"}}/>
            {search&&<button onClick={()=>setSrch("")} aria-label="Xoá" style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",background:"#f0f0f0",border:"none",width:20,height:20,borderRadius:"50%",cursor:"pointer",color:"var(--mut)",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>}
          </div>
          <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:2}}>
            {cats.map(c=>(
              <button key={c.key} onClick={()=>{setCat(c.key);setSrch("");}}
                style={{flexShrink:0,fontSize:11,padding:"7px 14px",border:`1.5px solid ${cat===c.key?"var(--or)":"var(--bd)"}`,borderRadius:"var(--r-pill)",cursor:"pointer",background:cat===c.key?"var(--or)":"#fff",color:cat===c.key?"#fff":"var(--text2)",fontWeight:cat===c.key?700:500,whiteSpace:"nowrap",boxShadow:cat===c.key?"var(--sh-or)":"none"}}>{c.label}</button>
            ))}
          </div>
        </div>

        <div style={{flexShrink:0,padding:"12px 14px",background:"var(--bg)"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
            {filtered.map(p=>{
              const q=cqty(p.id);
              const out=p.stock===0;
              return (
                <div key={p.id} className="card-hover" style={{position:"relative",border:`1.5px solid ${q>0?"var(--or)":"var(--bd2)"}`,borderRadius:"var(--r-md)",padding:"10px 10px 10px",background:q>0?"var(--orl)":"#fff",opacity:out?.6:1,transition:"all .18s var(--ease)",display:"flex",flexDirection:"column",boxShadow:q>0?"var(--sh-or)":"var(--sh-sm)"}}>
                  {q>0&&<div style={{position:"absolute",top:6,right:6,background:"var(--or)",color:"#fff",fontSize:10,fontWeight:800,minWidth:18,height:18,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",padding:"0 5px",boxShadow:"var(--sh-or)"}}>{q}</div>}
                  <div style={{position:"absolute",top:6,left:6}}><StBdg stock={p.stock}/></div>
                  <div style={{fontSize:38,marginTop:14,marginBottom:6,textAlign:"center",lineHeight:1,filter:out?"grayscale(1)":"none"}}>{p.emoji}</div>
                  <div className="clamp-2" style={{fontSize:12.5,fontWeight:600,color:"var(--text)",marginBottom:4,lineHeight:1.35,minHeight:34}}>{p.name}</div>
                  <div style={{fontSize:15,color:"var(--or)",fontWeight:800,marginBottom:8,fontFamily:"system-ui"}}>{fmt(p.price)}</div>
                  {!out&&(q===0
