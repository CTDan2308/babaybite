                {o.schA && <div style={{fontSize:11,color:"#1E40AF",background:"#EFF6FF",border:"1px solid #93C5FD",borderRadius:"var(--r-sm)",padding:"4px 9px",marginBottom:6,fontWeight:700,display:"inline-flex",alignItems:"center",gap:4}}>⏰ Hẹn giao: {schedLabel(o)}</div>}
                <div style={{fontSize:11,color:"var(--mut)",marginBottom:o.note?6:8,lineHeight:1.55,background:"#FAFAFA",padding:"6px 9px",borderRadius:"var(--r-sm)"}}>{o.items.map(i=>`${i.name}×${i.qty}${i.note?` (${i.note})`:""}`).join(" · ")}</div>
                {o.note&&<div style={{fontSize:11,color:"var(--or)",marginBottom:8,background:"var(--orl)",padding:"5px 9px",borderRadius:"var(--r-sm)",fontWeight:500}}><i className="ti ti-note" style={{fontSize:11,marginRight:3}}/>{o.note}</div>}
                <div style={{fontSize:10.5,color:"var(--mut2)",marginBottom:9,display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span><i className="ti ti-user" style={{fontSize:11,marginRight:2}}/><strong style={{color:"var(--text2)"}}>{byUser?.name||"—"}</strong></span>
                  {splitKpi&&<span>· <i className="ti ti-target" style={{fontSize:11,marginRight:2,color:"var(--or)"}}/>KPI <strong style={{color:"var(--or)"}}>{kpiUser?.name||"—"}</strong></span>}
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px dashed var(--bd2)"}}>
                  <div>
                    <span style={{fontSize:15,fontWeight:800,color:"var(--or)"}}>{fmt(iTot(o))}</span>
                    <span className="chip" style={{marginLeft:6,fontSize:10}}>{o.pay==="qr"?"📱 QR":"💵 Mặt"}</span>
                  </div>
                  <div style={{display:"flex",gap:5}}>
                    {canEditOrder && (
                      <button onClick={()=>setEditId(o.id)} className="btn-ghost"
                        style={{fontSize:11,padding:"5px 11px",borderRadius:"var(--r-sm)",color:"var(--info)",borderColor:"#93C5FD"}}
                        onMouseOver={e=>{e.currentTarget.style.background="#EFF6FF"}}
                        onMouseOut={e=>{e.currentTarget.style.background="#fff"}}>
                        <i className="ti ti-edit" style={{fontSize:12,marginRight:2}}/>Sửa
                      </button>
                    )}
                    <button onClick={()=>setCancelId(o.id)} className="btn-ghost"
                      style={{fontSize:11,padding:"5px 11px",borderRadius:"var(--r-sm)",color:"var(--err)",borderColor:"#FCA5A5"}}
                      onMouseOver={e=>{e.currentTarget.style.background="var(--err-bg)";e.currentTarget.style.color="var(--err)"}}
                      onMouseOut={e=>{e.currentTarget.style.background="#fff";e.currentTarget.style.color="var(--err)"}}>
                      <i className="ti ti-x" style={{fontSize:12,marginRight:2}}/>Huỷ
                    </button>
                    {isAdmin && deleteOrder && (
                      <button onClick={()=>deleteOrder(o.id)} title="Admin: xoá vĩnh viễn"
                        style={{fontSize:11,padding:"5px 11px",borderRadius:"var(--r-sm)",background:"#FEE2E2",border:"1px solid #FCA5A5",color:"#B91C1C",cursor:"pointer",fontWeight:700}}
                        onMouseOver={e=>e.currentTarget.style.background="#FECACA"}
                        onMouseOut={e=>e.currentTarget.style.background="#FEE2E2"}>
                        <i className="ti ti-trash" style={{fontSize:12}}/>
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {editOrder && (
        <EditOrderModal order={editOrder} products={products} categories={categories} zones={zones} pickupLocs={pickupLocs}
          staff={staff} currentUser={currentUser} shiftAssignments={shiftAssignments} currentShift={currentShift}
          onClose={()=>setEditId(null)} onSave={saveEdit}/>
      )}
      {cancelOrder && (
        <ConfirmDialog
          icon="🗑️" danger
          title={`Huỷ đơn ${cancelOrder.id}?`}
          message="Đơn sẽ chuyển sang trạng thái ĐÃ HUỶ và hoàn lại kho. Không thể hoàn tác."
          detail={<span><b>{cancelOrder.cus}</b>{cancelOrder.ph?` · ${cancelOrder.ph}`:""}<br/>{cancelOrder.items.map(i=>`${i.name}×${i.qty}`).join(", ")}<br/><b style={{color:"var(--or)"}}>{fmt(iTot(cancelOrder))}</b></span>}
          confirmLabel="Huỷ đơn" cancelLabel="Không"
          onConfirm={()=>{cancel(cancelOrder.id);setCancelId(null);}}
          onClose={()=>setCancelId(null)}/>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   CUSTOMER ORDER SCREEN (v1.4) — public, không cần PIN
   Truy cập: ?customer=1 hoặc ?qr=<table_id>
══════════════════════════════════════════════════════════ */
function CustomerOrderScreen({products,categories,zones,toast}){
  const [cart,setCart]=useState({}); // {pid: qty}
  const [showSheet,setShowSheet]=useState(false);
  const [form,setForm]=useState({cus:"",ph:"",type:"tai_cho",adr:"",zoneIdx:0,note:""});
  const [submitting,setSubmitting]=useState(false);
  const [myOrder,setMyOrder]=useState(()=>{
    try { return JSON.parse(localStorage.getItem("clb_customer_order")||"null"); } catch { return null; }
  });
  const [orderStatus,setOrderStatus]=useState(myOrder?.st||null);
  const [tableId]=useState(()=>new URLSearchParams(location.search).get("qr"));

  const cats = categories.length ? categories : Object.keys(CL_FALLBACK).map((k,i)=>({key:k,label:CL_FALLBACK[k],sort:i}));
  const [activeCat,setActiveCat]=useState(cats[0]?.key||"pha_che");
  const visible = products.filter(p=>p.on!==false && p.stock>0);
  const inCat = visible.filter(p=>p.cat===activeCat);

  const items = Object.entries(cart).map(([pid,qty])=>{
    const p=products.find(x=>x.id===+pid);
    return p?{pid:+pid,name:p.name,qty,p:p.price,emoji:p.emoji,stock:p.stock}:null;
  }).filter(Boolean);
  const subtotal = items.reduce((s,i)=>s+i.qty*i.p,0);
  const dFee = form.type==="ship" ? (zones[form.zoneIdx]?.fee||0) : 0;
  const total = subtotal + dFee;

  // Realtime track đơn của mình (nếu đã đặt)
  useEffect(()=>{
    if(!myOrder?.num) return;
    const ch = sb.channel("customer-order-"+myOrder.num)
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"orders",filter:`num=eq.${myOrder.num}`},p=>{
        if(p.new?.st){
          setOrderStatus(p.new.st);
          if(p.new.st==="hoan_thanh") toast("✅ Đơn của bạn đã hoàn thành!","success");
        }
      }).subscribe();
    return ()=>sb.removeChannel(ch);
  },[myOrder?.num]);

  const inc=p=>{
    if((cart[p.id]||0)>=p.stock){ toast(`Chỉ còn ${p.stock} ${p.name}`,"warn"); return; }
    setCart(c=>({...c,[p.id]:(c[p.id]||0)+1}));
  };
  const dec=pid=>setCart(c=>{const n={...c};if(n[pid]>1)n[pid]--;else delete n[pid];return n;});

  const submit=async()=>{
    if(!form.cus.trim()){ toast("Vui lòng nhập tên","warn"); return; }
    if(!items.length){ toast("Giỏ đang trống","warn"); return; }
    if(form.type==="ship" && !form.adr.trim()){ toast("Vui lòng nhập địa chỉ giao","warn"); return; }
    setSubmitting(true);
    try {
      // Lấy số đơn kế tiếp
      const {data:maxRow} = await sb.from("orders").select("num").order("num",{ascending:false}).limit(1).maybeSingle();
      const num = (maxRow?.num||0)+1;
      const newOrder = {
        num, t:nowS(), cus:form.cus.trim(), ph:form.ph||"", type:form.type,
        adr:form.type==="ship"?form.adr.trim():(tableId?`Bàn ${tableId}`:""),
        items:items.map(i=>({pid:i.pid,name:i.name,qty:i.qty,p:i.p,note:""})),
        st:"cho_xac_nhan", pay:"cash", d_fee:dFee, disc:0, d_t:"fixed",
        by_id:null, kpi_id:null, sid:null,
        note:(form.note||"")+(tableId?` [QR bàn ${tableId}]`:" [Khách tự đặt]"),
        return_reason:null
      };
      const {error} = await sb.from("orders").insert(newOrder);
      if(error){ toast("Lỗi đặt đơn: "+error.message,"error"); setSubmitting(false); return; }
      // KHÔNG trừ kho lúc này — trực đơn duyệt mới trừ (tránh lãng phí kho cho đơn bị từ chối)
      const saved={num,id:`ĐH${String(num).padStart(3,"0")}`,st:"cho_xac_nhan",total,cus:form.cus.trim(),items:newOrder.items,t:nowS()};
      localStorage.setItem("clb_customer_order",JSON.stringify(saved));
      setMyOrder(saved); setOrderStatus("cho_xac_nhan");
      setCart({}); setShowSheet(false); setSubmitting(false);
      toast(`✅ Đã đặt đơn ${saved.id} — đang chờ duyệt`,"success");
    } catch(e){
      console.error(e); toast("Lỗi không xác định","error"); setSubmitting(false);
    }
  };

  const newOrder=()=>{
    localStorage.removeItem("clb_customer_order");
    setMyOrder(null); setOrderStatus(null);
    setForm({cus:"",ph:"",type:"tai_cho",adr:"",zoneIdx:0,note:""});
  };

  // ── MÀN STATUS sau khi đặt ──
  if(myOrder){
    const stInfo=ST[orderStatus]||ST.moi;
    const statusSteps=["cho_xac_nhan","moi","pha_che","san_sang","dang_giao","hoan_thanh"];
    const curStep=statusSteps.indexOf(orderStatus);
    const isCancelled=orderStatus==="huy"||orderStatus==="hoan_hang";
    return (
      <div style={{minHeight:"100vh",background:"linear-gradient(180deg,#FFF4F0 0%,#fff 100%)",padding:"24px 16px",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
        <div style={{maxWidth:480,margin:"0 auto"}}>
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontSize:48,marginBottom:8}}>{isCancelled?"😢":(orderStatus==="hoan_thanh"?"🎉":"☕")}</div>
            <div style={{fontSize:20,fontWeight:800,color:"var(--or)"}}>{isCancelled?"Đơn đã huỷ":(orderStatus==="hoan_thanh"?"Cảm ơn bạn!":"Đã ghi nhận đơn")}</div>
            <div style={{fontSize:13,color:"var(--mut)",marginTop:4}}>Mã đơn: <b style={{color:"var(--text)"}}>{myOrder.id}</b></div>
          </div>
          <div style={{background:"#fff",borderRadius:14,padding:18,boxShadow:"var(--sh-md)",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <span style={{fontSize:12,color:"var(--mut)"}}>Trạng thái</span>
              <span style={{padding:"4px 10px",borderRadius:"var(--r-pill)",background:stInfo.bg,color:stInfo.color,fontSize:12,fontWeight:700}}>{stInfo.label}</span>
            </div>
            {!isCancelled && (
              <div style={{display:"flex",justifyContent:"space-between",position:"relative",marginBottom:12}}>
                <div style={{position:"absolute",top:10,left:10,right:10,height:2,background:"#E8E8E8",zIndex:0}}/>
                <div style={{position:"absolute",top:10,left:10,height:2,background:"var(--or)",zIndex:1,transition:"width .4s var(--ease)",width:curStep<0?0:`calc(${(curStep/(statusSteps.length-1))*100}% - 20px)`}}/>
                {statusSteps.map((s,i)=>(
                  <div key={s} style={{position:"relative",zIndex:2,display:"flex",flexDirection:"column",alignItems:"center",flex:1}}>
                    <div style={{width:20,height:20,borderRadius:"50%",background:i<=curStep?"var(--or)":"#E8E8E8",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800}}>{i<=curStep?"✓":i+1}</div>
                    <div style={{fontSize:9,color:i<=curStep?"var(--or)":"var(--mut)",marginTop:4,fontWeight:600,textAlign:"center"}}>{ST[s]?.label}</div>
                  </div>
                ))}
              </div>
            )}
            <div style={{borderTop:"1px dashed var(--bd)",marginTop:12,paddingTop:12}}>
              {myOrder.items.map((i,idx)=>(
                <div key={idx} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"4px 0"}}>
                  <span>{i.name} × {i.qty}</span><span>{fmt(i.qty*i.p)}</span>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",fontWeight:800,fontSize:14,marginTop:8,paddingTop:8,borderTop:"1px solid var(--bd2)",color:"var(--or)"}}>
                <span>Tổng</span><span>{fmt(myOrder.total)}</span>
              </div>
            </div>
          </div>
          <button onClick={newOrder} className="btn-pri" style={{width:"100%",padding:"12px",borderRadius:"var(--r-md)",fontSize:13.5}}>Đặt đơn mới</button>
          <div style={{textAlign:"center",fontSize:10.5,color:"var(--mut)",marginTop:12}}>Trang sẽ tự cập nhật khi trạng thái thay đổi</div>
        </div>
      </div>
    );
  }

  // ── MÀN MENU ──
  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",paddingBottom:items.length?86:20,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
      <div style={{background:"var(--or-grad)",color:"#fff",padding:"18px 16px 14px",boxShadow:"var(--sh-md)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:28}}>🛒</div>
          <div>
            <div style={{fontSize:16,fontWeight:800,letterSpacing:.3}}>BaBayBite</div>
            <div style={{fontSize:11,opacity:.9}}>{tableId?`📍 Bàn ${tableId}`:"Đặt món trực tuyến"}</div>
          </div>
        </div>
      </div>

      <div style={{display:"flex",gap:6,padding:"12px 12px 8px",overflowX:"auto",background:"#fff",borderBottom:"1px solid var(--bd2)",position:"sticky",top:0,zIndex:5}}>
        {cats.map(c=>(
          <button key={c.key} onClick={()=>setActiveCat(c.key)}
            style={{flexShrink:0,padding:"7px 14px",borderRadius:"var(--r-pill)",border:"1px solid "+(activeCat===c.key?"var(--or)":"var(--bd)"),background:activeCat===c.key?"var(--or)":"#fff",color:activeCat===c.key?"#fff":"var(--text2)",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
            {c.label}
          </button>
        ))}
      </div>

      <div style={{padding:12,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
        {inCat.length===0 && <div style={{gridColumn:"1/-1",textAlign:"center",padding:30,color:"var(--mut)",fontSize:12}}>Không còn món trong danh mục này</div>}
        {inCat.map(p=>{
          const q=cart[p.id]||0;
          return (
            <div key={p.id} className="card" style={{padding:10,display:"flex",flexDirection:"column",gap:6}}>
              <div style={{fontSize:36,textAlign:"center",lineHeight:1}}>{p.emoji||"🍽️"}</div>
              <div style={{fontSize:12.5,fontWeight:700,color:"var(--text)",minHeight:32}} className="clamp-2">{p.name}</div>
              <div style={{fontSize:13,fontWeight:800,color:"var(--or)"}}>{fmt(p.price)}</div>
              {q===0 ? (
                <button onClick={()=>inc(p)} className="btn-pri" style={{padding:"7px",borderRadius:"var(--r-sm)",fontSize:12,marginTop:"auto"}}>+ Thêm</button>
              ) : (
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:"auto",background:"var(--orl)",borderRadius:"var(--r-sm)",padding:"4px"}}>
                  <button onClick={()=>dec(p.id)} style={{border:"none",background:"#fff",width:28,height:28,borderRadius:4,cursor:"pointer",color:"var(--or)",fontSize:16,fontWeight:800}}>−</button>
                  <span style={{fontWeight:800,color:"var(--or)",fontSize:14}}>{q}</span>
                  <button onClick={()=>inc(p)} style={{border:"none",background:"var(--or)",color:"#fff",width:28,height:28,borderRadius:4,cursor:"pointer",fontSize:16,fontWeight:800}}>+</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Floating cart bar */}
      {items.length>0 && !showSheet && (
        <div onClick={()=>setShowSheet(true)} style={{position:"fixed",bottom:12,left:12,right:12,background:"var(--or-grad)",color:"#fff",borderRadius:14,padding:"12px 16px",boxShadow:"var(--sh-lg)",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",zIndex:30,animation:"fadeUp .25s var(--ease)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,borderRadius:"50%",background:"rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🛒</div>
            <div>
              <div style={{fontSize:12,opacity:.9}}>{items.reduce((s,i)=>s+i.qty,0)} món</div>
              <div style={{fontSize:15,fontWeight:800}}>{fmt(subtotal)}</div>
            </div>
          </div>
          <span style={{fontSize:13,fontWeight:700}}>Đặt đơn →</span>
        </div>
      )}

      {/* Bottom sheet — cart + form */}
      {showSheet && (
        <>
          <div onClick={()=>setShowSheet(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:40,animation:"fadeIn .2s var(--ease)"}}/>
          <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderRadius:"18px 18px 0 0",zIndex:41,maxHeight:"92vh",display:"flex",flexDirection:"column",animation:"fadeUp .25s var(--ease)"}}>
            <div style={{padding:"12px 16px",borderBottom:"1px solid var(--bd2)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:800,fontSize:15}}>Xác nhận đơn</div>
              <button onClick={()=>setShowSheet(false)} style={{border:"none",background:"none",fontSize:22,cursor:"pointer",color:"var(--mut)"}}>✕</button>
            </div>
            <div style={{overflowY:"auto",padding:14,flex:1}}>
              {items.map(i=>(
                <div key={i.pid} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid var(--bd2)"}}>
                  <span style={{fontSize:22}}>{i.emoji}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600}} className="clamp-1">{i.name}</div>
                    <div style={{fontSize:11.5,color:"var(--or)",fontWeight:700}}>{fmt(i.p)}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <button onClick={()=>dec(i.pid)} style={{border:"1px solid var(--bd)",background:"#fff",width:26,height:26,borderRadius:4,cursor:"pointer",fontSize:14}}>−</button>
                    <span style={{minWidth:20,textAlign:"center",fontWeight:700}}>{i.qty}</span>
                    <button onClick={()=>{const p=products.find(x=>x.id===i.pid); inc(p);}} style={{border:"1px solid var(--or)",background:"var(--or)",color:"#fff",width:26,height:26,borderRadius:4,cursor:"pointer",fontSize:14}}>+</button>
                  </div>
                </div>
              ))}
              <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:9}}>
                <div>
                  <div style={{fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:700,textTransform:"uppercase"}}>Tên của bạn *</div>
                  <input value={form.cus} onChange={e=>setForm(f=>({...f,cus:e.target.value}))} placeholder="Nhập tên..."
                    style={{width:"100%",padding:"10px 12px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:13.5}}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:700,textTransform:"uppercase"}}>SĐT (để liên hệ nếu cần)</div>
                  <input value={form.ph} onChange={e=>setForm(f=>({...f,ph:e.target.value}))} placeholder="09xx..." inputMode="tel"
                    style={{width:"100%",padding:"10px 12px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:13.5}}/>
                </div>
                {!tableId && (
                  <div>
                    <div style={{fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:700,textTransform:"uppercase"}}>Loại đơn</div>
                    <div style={{display:"flex",gap:6}}>
                      {[["tai_cho","🏠","Tại chỗ"],["ship","🛵","Giao hàng"]].map(([v,e,l])=>(
                        <button key={v} onClick={()=>setForm(f=>({...f,type:v}))} type="button"
                          style={{flex:1,padding:"9px",border:`1.5px solid ${form.type===v?"var(--or)":"var(--bd)"}`,background:form.type===v?"var(--orl)":"#fff",color:form.type===v?"var(--or)":"var(--text2)",borderRadius:"var(--r-sm)",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>{e} {l}</button>
                      ))}
                    </div>
                  </div>
                )}
                {form.type==="ship" && (
                  <>
                    <div>
                      <div style={{fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:700,textTransform:"uppercase"}}>Địa chỉ giao *</div>
                      <input value={form.adr} onChange={e=>setForm(f=>({...f,adr:e.target.value}))} placeholder="Tòa B5 P.302..."
                        style={{width:"100%",padding:"10px 12px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:13.5}}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:700,textTransform:"uppercase"}}>Khoảng cách (phí ship)</div>
                      <select value={form.zoneIdx} onChange={e=>setForm(f=>({...f,zoneIdx:+e.target.value}))}
                        style={{width:"100%",padding:"10px 12px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:13}}>
                        {zones.map((z,i)=><option key={i} value={i}>{z.lb} · {fmt(z.fee)}</option>)}
                      </select>
                    </div>
                  </>
                )}
                <div>
                  <div style={{fontSize:10,color:"var(--mut)",marginBottom:4,fontWeight:700,textTransform:"uppercase"}}>Ghi chú</div>
                  <textarea value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="Ít đường, ko đá..." rows={2}
                    style={{width:"100%",padding:"10px 12px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:13,resize:"vertical"}}/>
                </div>
              </div>
            </div>
            <div style={{padding:"12px 16px",borderTop:"1px solid var(--bd2)",background:"#fff"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--mut)",marginBottom:3}}>
                <span>Tạm tính</span><span>{fmt(subtotal)}</span>
              </div>
              {form.type==="ship" && (
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--mut)",marginBottom:3}}>
                  <span>Phí ship</span><span>{fmt(dFee)}</span>
                </div>
              )}
              <div style={{display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:800,color:"var(--or)",marginBottom:10}}>
                <span>Tổng cộng</span><span>{fmt(total)}</span>
              </div>
              <button onClick={submit} disabled={submitting||!form.cus.trim()||(form.type==="ship"&&!form.adr.trim())}
                className="btn-pri-grad" style={{width:"100%",padding:"13px",borderRadius:"var(--r-md)",fontSize:14}}>
                {submitting?"Đang gửi...":"✓ Đặt đơn ngay"}
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   KITCHEN (KDS)
══════════════════════════════════════════════════════════ */
function KitchenScreen({orders,setOrders,products,setProducts,staff=[],toast}){
  const [recipe,setRecipe] = useState(null);
  const [now,setNow] = useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),60000);return()=>clearInterval(t);},[]);
  const NOW = now.getHours()*60 + now.getMinutes();
  const elapsed = t => {const[h,m]=(t||"00:00").split(":").map(Number);const d=NOW-(h*60+m);return d>=0?d:0;};

  // v1.9.5: nhắc làm đơn HẸN GIỜ trước REMIND_LEAD phút — toast 1 lần / đơn (reset nếu đổi lịch ra xa)
  const remindedRef = useRef(new Set());
  useEffect(()=>{
    orders.forEach(o=>{
      if(o.st!=="moi" && o.st!=="pha_che") return;
      const dl = minsToDeadline(o, now);
      if(dl===null) return;
      if(dl<=REMIND_LEAD && dl>-180 && !remindedRef.current.has(o.id)){
        remindedRef.current.add(o.id);
        toast(`🔔 Cần làm đơn ${o.id} ${dl>=0?`trong ${dl} phút`:`— ĐÃ TRỄ ${-dl} phút`} (hẹn giao ${schedLabel(o)})`, dl<0?"error":"warn");
      } else if(dl>REMIND_LEAD && remindedRef.current.has(o.id)){
        remindedRef.current.delete(o.id);
      }
    });
  },[orders, now, toast]);

  const advance=o=>{
    const ns=nxSt(o); if(!ns) return;
    setOrders(os=>os.map(x=>x.id===o.id?{...x,st:ns}:x));
    toast(`${o.id} → ${ST[ns]?.label}`,"success");
  };

  const cols=[
    {k:"moi",     title:"Đơn mới",      ic:"ti-clipboard-plus",  bg:"#FFF8F4",btnBg:"var(--or-grad)",btnC:"#fff"},
    {k:"pha_che", title:"Đang pha chế", ic:"ti-flame",            bg:"#EFF6FF",btnBg:"linear-gradient(135deg,#3B82F6,#1E40AF)",btnC:"#fff"},
    {k:"san_sang",title:"Sẵn sàng",     ic:"ti-circle-check",     bg:"#FAF5FF",btnBg:"linear-gradient(135deg,#22C55E,#15803D)",btnC:"#fff"},
  ];

  const saveRecipe=(id,updated)=>setProducts(ps=>ps.map(p=>p.id===id?{...p,recipe:updated}:p));
  const recipeProds = products.filter(p=>p.cat==="pha_che"&&p.on!==false);

  return (
    <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",background:"var(--bg)"}}>
      {recipeProds.length>0&&(
        <div style={{padding:"8px 16px",borderBottom:"1px solid var(--bd)",background:"#fff",display:"flex",alignItems:"center",gap:8,overflowX:"auto",flexShrink:0,minHeight:46}}>
          <span style={{fontSize:10,color:"var(--mut)",flexShrink:0,fontWeight:700,letterSpacing:.5,display:"flex",alignItems:"center",gap:4}}>
            <i className="ti ti-book-2" style={{fontSize:14,color:"var(--or)"}}/>CÔNG THỨC
          </span>
          {recipeProds.map(p=>(
            <button key={p.id} onClick={()=>setRecipe(p)} className="btn-ghost"
              style={{fontSize:11,padding:"5px 11px",borderRadius:"var(--r-pill)",whiteSpace:"nowrap",flexShrink:0,fontWeight:600}}>
              {p.emoji} {p.name}
            </button>
          ))}
        </div>
      )}

      <div className="kds-shell" style={{flex:1,overflow:"hidden",display:"flex"}}>
        {cols.map((col,ci)=>{
          const colOrders=orders.filter(o=>o.st===col.k);
          const stColor=ST[col.k]?.color||"var(--or)";
          return (
            <div key={col.k} style={{flex:1,borderRight:ci<2?"1px solid var(--bd)":"none",background:col.bg,overflowY:"auto",display:"flex",flexDirection:"column",minWidth:0}}>
              <div style={{padding:"12px 14px",borderBottom:"1px solid rgba(0,0,0,.06)",display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,.92)",backdropFilter:"blur(6px)",flexShrink:0,position:"sticky",top:0,zIndex:2,boxShadow:"0 2px 4px rgba(0,0,0,.03)"}}>
                <i className={`ti ${col.ic}`} style={{fontSize:18,color:stColor}}/>
                <span style={{fontSize:12.5,fontWeight:800,color:"var(--text)"}}>{col.title}</span>
                <span className="chip" style={{background:stColor+"22",color:stColor,fontWeight:800}}>{colOrders.length}</span>
                {col.k==="moi"&&colOrders.length>0&&<span style={{fontSize:10,color:"var(--err)",fontWeight:800,marginLeft:"auto",animation:"pulse 1.8s infinite",display:"flex",alignItems:"center",gap:3}}>● CẦN XỬ LÝ</span>}
              </div>
              <div style={{padding:10,display:"flex",flexDirection:"column",gap:10}}>
                {colOrders.map(o=>{
                  const dl = minsToDeadline(o, now);   // phút tới giờ giao (null nếu không hẹn)
                  const sched = dl!==null;
                  const overdue = sched && dl<0;
                  const mins=elapsed(o.t);
                  const urgent = sched ? (o.st!=="san_sang" && dl<=REMIND_LEAD) : mins>15;
                  const warn   = sched ? (!urgent && dl<=REMIND_LEAD+20) : (mins>10&&mins<=15);
                  return (
                    <div key={o.id} className={urgent?"shake":""} style={{background:"#fff",border:`2px solid ${urgent?"#FCA5A5":warn?"#FCD34D":"var(--bd)"}`,borderRadius:"var(--r-md)",padding:13,transition:"border .2s",boxShadow:urgent?"0 4px 16px rgba(220,38,38,.15)":"var(--sh-sm)"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                        <span style={{fontFamily:"ui-monospace,monospace",fontWeight:800,color:"var(--or)",fontSize:15}}>{o.id}</span>
                        <div style={{display:"flex",alignItems:"center",gap:5}}>
                          {urgent&&<span style={{fontSize:9.5,color:"#fff",fontWeight:800,background:"var(--err)",padding:"3px 7px",borderRadius:"var(--r-pill)",letterSpacing:.3}}>{sched?(overdue?"TRỄ GIAO":"GẤP"):"TRỄ"}</span>}
                          {warn&&<span style={{fontSize:9.5,color:"#fff",fontWeight:800,background:"var(--warn)",padding:"3px 7px",borderRadius:"var(--r-pill)",letterSpacing:.3}}>{sched?"SẮP TỚI":"SẮP TRỄ"}</span>}
                          <span title={sched?`Hẹn giao ${schedLabel(o)}`:`${mins} phút trong bếp`} style={{fontSize:11,padding:"3px 8px",borderRadius:"var(--r-pill)",background:urgent?"var(--err-bg)":warn?"var(--warn-bg)":"#F3F4F6",color:urgent?"var(--err)":warn?"var(--warn)":"var(--mut)",fontWeight:700,display:"inline-flex",alignItems:"center",gap:2}}>
                            <i className={sched?"ti ti-alarm":"ti ti-clock"} style={{fontSize:11}}/>{sched ? (dl>=0?`${dl}p`:`-${-dl}p`) : `${mins}p`}
                          </span>
                        </div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
                        <span style={{fontSize:12.5,color:"var(--text)",fontWeight:700}}>{o.cus}</span>
                        <TPill type={o.type}/>
                      </div>
                      {sched && o.st!=="san_sang" && (
                        <div style={{marginBottom:10,padding:"7px 10px",borderRadius:"var(--r-sm)",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:6,
                          background:overdue?"var(--err-bg)":urgent?"#FEF3C7":"#EFF6FF",
                          color:overdue?"var(--err)":urgent?"#92400E":"#1E40AF",
                          border:`1px solid ${overdue?"#FCA5A5":urgent?"#FCD34D":"#93C5FD"}`}}>
                          <i className="ti ti-bell-ringing" style={{fontSize:14}}/>
                          <span>🔔 Làm trước <b>{o.schA}</b>{o.schD&&o.schD!==todayISO()?` · ${isoWeekday(o.schD)} ${isoToVNShort(o.schD)}`:""} — {dl>=0?`còn ${dl} phút`:`đã trễ ${-dl} phút`}</span>
                        </div>
                      )}
                      {o.items.map((item,ii)=>{
                        const prod=products.find(p=>p.id===item.pid);
                        return (
                          <div key={ii} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13,color:"var(--text)",padding:"6px 0",borderBottom:ii<o.items.length-1?"1px dashed #F0F0F0":"none"}}>
                            <div style={{lineHeight:1.4,flex:1,minWidth:0}}>
                              <span style={{fontWeight:600}}>{item.name}</span>
                              {item.note&&<div style={{fontSize:10.5,color:"var(--or)",marginTop:1}}><i className="ti ti-note" style={{fontSize:10,marginRight:2}}/>{item.note}</div>}
                            </div>
                            <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,marginLeft:6}}>
                              <span style={{fontWeight:800,fontSize:17,color:"var(--or)",minWidth:30,textAlign:"right"}}>×{item.qty}</span>
                              {prod?.cat==="pha_che"&&(
                                <button onClick={()=>setRecipe(prod)} title="Xem công thức"
                                  style={{fontSize:10,padding:"3px 8px",border:"1px solid #FFD4C2",borderRadius:"var(--r-pill)",background:"var(--orl)",color:"var(--or)",cursor:"pointer",fontWeight:800,letterSpacing:.3}}>CT</button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                      {o.note&&<div style={{fontSize:11,color:"var(--or)",marginTop:7,fontStyle:"italic",background:"var(--orl)",padding:"5px 9px",borderRadius:"var(--r-sm)"}}><i className="ti ti-note" style={{fontSize:11,marginRight:3}}/>{o.note}</div>}
                      {/* v1.6.1: Đơn ship sau khi pha xong → chờ shipper nhận (KDS không advance được) */}
                      {o.st==="san_sang" && o.type==="ship" && (
                        <div style={{marginTop:11,padding:"8px 10px",background:o.sid?"#DCFCE7":"#FEF3C7",border:`1px solid ${o.sid?"#22C55E":"#F59E0B"}55`,borderRadius:"var(--r-sm)",display:"flex",alignItems:"center",gap:6,fontSize:11,fontWeight:700,color:o.sid?"#15803D":"#92400E"}}>
                          <span style={{fontSize:14}}>🛵</span>
                          {o.sid ? `${staff.find(s=>s.id===o.sid)?.name||"Shipper"} sẽ tới lấy` : "Đang chờ shipper nhận đơn"}
                        </div>
                      )}
                      {nxLb(o)&&(
                        <button onClick={()=>advance(o)}
                          style={{width:"100%",marginTop:11,padding:"10px",background:col.btnBg,border:"none",borderRadius:"var(--r-md)",fontSize:12.5,fontWeight:800,cursor:"pointer",color:col.btnC,letterSpacing:.3,boxShadow:"var(--sh-sm)",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                          <i className="ti ti-arrow-right" style={{fontSize:14}}/>{nxLb(o)}
                        </button>
                      )}
                    </div>
                  );
                })}
                {colOrders.length===0&&(
                  <div style={{textAlign:"center",padding:"40px 0",color:"var(--mut2)"}}>
                    <i className={`ti ${col.ic}`} style={{fontSize:36,display:"block",marginBottom:6,opacity:.4}}/>
                    <div style={{fontSize:12,fontWeight:500}}>Không có đơn</div>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {recipe&&<RecipeModal product={recipe} onClose={()=>setRecipe(null)}
        onSave={updated=>saveRecipe(recipe.id,updated)} toast={toast}/>}
    </div>
  );
}

/* Modal nhập lý do hoàn hàng */
/* v1.15: Modal QR thu tiền (VietQR động) — dùng ở ShipperApp & ShipperScreen */
function QrPayModal({order,appConfig={},onClose,toast}){
  const baseAmt = (order.items||[]).reduce((s,i)=>s+i.qty*i.p,0) - (order.disc||0) + (order.dFee||0);
  const [amt,setAmt] = useState(baseAmt);
  const configured = !!(appConfig.bank && appConfig.acc);
  const info = `${order.id} ${order.cus||""}`.slice(0,25);
  const url = configured ? vietqrUrl(appConfig, amt, info) : "";
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:18,animation:"fadeIn .15s"}}>
      <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:360,padding:20,animation:"fadeUp .2s ease",textAlign:"center"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{fontSize:15,fontWeight:800,color:"var(--text)"}}>📲 QR thu tiền · {order.id}</div>
          <button onClick={onClose} style={{background:"#f0f0f0",border:"none",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:14,color:"var(--mut)"}}>✕</button>
        </div>
        {!configured ? (
          <div style={{padding:"24px 12px",color:"var(--err)",fontSize:12.5,fontWeight:600,lineHeight:1.6}}>
            <div style={{fontSize:30,marginBottom:8}}>⚠️</div>
            Chưa cấu hình tài khoản nhận tiền.<br/>Vào <b>Cài đặt → Tổng quan → Tài khoản nhận tiền (VietQR)</b> để nhập ngân hàng + số tài khoản.
          </div>
        ) : (
          <>
            <div style={{fontSize:11,color:"var(--mut)",marginBottom:8}}>Khách <b style={{color:"var(--text)"}}>{order.cus}</b> quét để chuyển khoản</div>
            <div style={{background:"#fff",border:"1px solid var(--bd)",borderRadius:12,padding:10,display:"inline-block",boxShadow:"var(--sh-sm)"}}>
              <img src={url} alt="VietQR" style={{width:240,height:240,objectFit:"contain",display:"block"}}
                onError={e=>{e.currentTarget.style.display="none";}}/>
            </div>
            <div style={{margin:"12px 0 4px",display:"flex",alignItems:"center",gap:8,justifyContent:"center"}}>
              <span style={{fontSize:11,color:"var(--mut)"}}>Số tiền</span>
              <input type="number" value={amt} onChange={e=>setAmt(Math.max(0,+e.target.value||0))}
                style={{width:130,padding:"7px 10px",border:"1px solid var(--bd)",borderRadius:8,fontSize:15,fontWeight:800,textAlign:"center",color:"var(--or)"}}/>
              <span style={{fontSize:11,color:"var(--mut)"}}>đ</span>
            </div>
            {amt!==baseAmt && <button onClick={()=>setAmt(baseAmt)} style={{fontSize:10.5,color:"var(--or)",background:"none",border:"none",cursor:"pointer",fontWeight:700}}>↺ Về tổng đơn {fmt(baseAmt)}</button>}
            <div style={{marginTop:10,padding:"9px 12px",background:"#F5F3FF",borderRadius:8,fontSize:11.5,color:"#5b21b6",textAlign:"left",lineHeight:1.6}}>
              <div><b>{appConfig.name||"—"}</b></div>
              <div>{appConfig.bank} · {appConfig.acc}</div>
              <div style={{color:"var(--mut)"}}>Nội dung: {info}</div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ReturnReasonModal({order,onClose,onConfirm}){
  const [reason,setReason] = useState("");
  const presets = ["Khách không nhận máy","Khách báo huỷ giữa đường","Sai địa chỉ","Sai món","Khác"];
  const submit = () => {
    const r = reason.trim();
    if (!r) return;
    onConfirm(r);
  };
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20,animation:"fadeIn .15s"}}>
      <div style={{background:"#fff",borderRadius:12,width:"100%",maxWidth:420,padding:20,animation:"fadeUp .2s ease"}}>
        <div style={{fontSize:16,fontWeight:700,color:"#212121",marginBottom:4}}>↩️ Hoàn hàng đơn {order.id}</div>
        <div style={{fontSize:12,color:"#767676",marginBottom:14}}>Khách: <b style={{color:"#212121"}}>{order.cus}</b> · 📍 {order.adr}</div>
        <div style={{fontSize:11,color:"#767676",fontWeight:600,marginBottom:5}}>Chọn lý do nhanh:</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>
          {presets.map(p=>(
            <button key={p} onClick={()=>setReason(p)}
              style={{fontSize:11,padding:"5px 10px",border:`1px solid ${reason===p?"var(--or)":"var(--bd)"}`,borderRadius:5,background:reason===p?"#FFF4F0":"#fff",cursor:"pointer",color:reason===p?"var(--or)":"#475569",fontWeight:reason===p?700:500}}>{p}</button>
          ))}
        </div>
        <div style={{fontSize:11,color:"#767676",fontWeight:600,marginBottom:5}}>Hoặc nhập chi tiết:</div>
        <textarea value={reason} onChange={e=>setReason(e.target.value)}
          placeholder="Mô tả lý do hoàn hàng..."
          style={{width:"100%",padding:"8px 10px",border:"1px solid var(--bd)",borderRadius:6,fontSize:12,minHeight:80,resize:"vertical"}}/>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{padding:"8px 16px",border:"1px solid var(--bd)",background:"#fff",borderRadius:6,cursor:"pointer",fontSize:12,color:"#475569"}}>Huỷ</button>
          <button onClick={submit} disabled={!reason.trim()}
            style={{padding:"8px 16px",border:"none",borderRadius:6,fontSize:12,fontWeight:700,cursor:reason.trim()?"pointer":"not-allowed",background:reason.trim()?"#9d174d":"#e0e0e0",color:"#fff"}}>
            Xác nhận hoàn hàng
          </button>
        </div>
      </div>
    </div>
  );
}
