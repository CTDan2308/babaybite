<style>
:root{
  /* Brand (Shopee-inspired) */
  --or:#EE4D2D;--orl:#FFF4F0;--ord:#C73D22;--orm:#FF8557;--or-grad:linear-gradient(135deg,#FF6633 0%,#EE4D2D 50%,#D73211 100%);
  /* Neutrals */
  --bg:#F5F5F5;--bd:#E8E8E8;--bd2:#F0F0F0;--text:#212121;--text2:#475569;--mut:#767676;--mut2:#9CA3AF;
  /* Semantic */
  --ok:#16A34A;--ok-bg:#F0FDF4;--warn:#D97706;--warn-bg:#FFFBEB;--err:#DC2626;--err-bg:#FEE2E2;--info:#2563EB;--info-bg:#EFF6FF;
  /* Radius & elevation */
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-pill:999px;
  --sh-sm:0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-lg:0 8px 24px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.04);
  --sh-or:0 4px 12px rgba(238,77,45,.25);
  /* Motion */
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d6d6d6;border-radius:4px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#a8a8a8;background-clip:padding-box;border:2px solid transparent}

/* Forms */
input,select,textarea,button{font-family:inherit;outline:none}
input,select,textarea{transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--or)!important;box-shadow:0 0 0 3px rgba(238,77,45,.12)}
input::placeholder,textarea::placeholder{color:var(--mut2)}
button{transition:background .15s var(--ease),box-shadow .15s var(--ease),transform .1s var(--ease)}
button:not(:disabled):active{transform:translateY(1px)}

/* Card */
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh-sm);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.card-hover:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}

/* Buttons */
.btn-pri{background:var(--or);color:#fff;border:none;cursor:pointer;font-weight:600;box-shadow:var(--sh-sm)}
.btn-pri:hover:not(:disabled){background:var(--ord);box-shadow:var(--sh-or)}
.btn-pri:disabled{background:#e5e5e5;color:#999;cursor:not-allowed;box-shadow:none}
.btn-pri-grad{background:var(--or-grad);color:#fff;border:none;cursor:pointer;font-weight:700;box-shadow:var(--sh-or)}
.btn-pri-grad:hover:not(:disabled){filter:brightness(1.05)}
.btn-pri-grad:disabled{background:#e5e5e5;color:#999;cursor:not-allowed;box-shadow:none;filter:none}
.btn-ghost{background:#fff;border:1px solid var(--bd);color:var(--text2);cursor:pointer;font-weight:500}
.btn-ghost:hover{border-color:var(--or);color:var(--or);background:var(--orl)}

/* Chips / pills */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:#f3f4f6;color:var(--text2);white-space:nowrap}
.chip-or{background:var(--orl);color:var(--or)}

/* Skeleton shimmer */
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.skeleton{background:linear-gradient(90deg,#f0f0f0 0,#f8f8f8 50%,#f0f0f0 100%);background-size:200px 100%;animation:shimmer 1.4s linear infinite;border-radius:6px}

/* Animations */
@keyframes slideRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes notifFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes notifCard{0%{transform:translateY(-18px) scale(.96);opacity:0}55%{transform:translateY(0) scale(1.02);opacity:1}100%{transform:translateY(0) scale(1)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(238,77,45,.5)}70%{box-shadow:0 0 0 14px rgba(238,77,45,0)}100%{box-shadow:0 0 0 0 rgba(238,77,45,0)}}
.fade-up{animation:fadeUp .25s var(--ease)}
.fade-in{animation:fadeIn .2s var(--ease)}
.shake{animation:shake .35s var(--ease)}
.pop{animation:pop .25s var(--ease)}
.ring-pulse{animation:ringPulse 1.4s infinite}

/* Text utils */
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp-1{display:-webkit-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Responsive helpers ── */
.app-shell{display:flex;height:100vh;overflow:hidden}
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}
.sidebar{width:220px;flex-shrink:0;transition:transform .25s ease}
.sb-overlay{display:none}
.mobile-only{display:none}
.desktop-only{display:flex}
.order-shell{display:flex;flex:1;overflow:hidden;background:var(--bg)}
.order-left{flex:1;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:#fff}
.order-right{width:340px;flex-shrink:0;overflow-y:auto;padding:12px;background:var(--bg)}

@media (max-width:900px){
  .order-right{width:300px}
}
@media (max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);box-shadow:2px 0 16px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .sb-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);z-index:150}
  .mobile-only{display:flex}
  .desktop-only{display:none}
  .order-shell{flex-direction:column}
  .order-left{border-right:none;border-bottom:1px solid var(--bd);max-height:none;flex:1;min-height:0}
  .order-right{width:100%;max-height:50vh;border-top:1px solid var(--bd);flex-shrink:0}
  .topbar-meta{display:none}

  .kds-shell{overflow-x:auto!important}
  .kds-shell > div{min-width:280px;flex:0 0 80%!important}

@media (max-width:480px){

  .grid-stats-5{grid-template-columns:repeat(2,1fr)!important}
  .hide-mobile{display:none!important}
}

/* Tính ca hiện tại dựa vào giờ phút (handle overnight shifts) */
const hmToMin = s => { const [h,m] = (s||"0:0").split(":").map(Number); return h*60+(m||0); };
const getCurrentShift = (shifts) => {
  if (!shifts || !shifts.length) return null;
  const d = new Date();
  const now = d.getHours()*60 + d.getMinutes();
  for (const s of shifts) {
    const start = hmToMin(s.start_at);
    const end   = hmToMin(s.end_at);
    if (end > start) {
      if (now >= start && now < end) return s;
    } else {
      if (now >= start || now < end) return s;
    }
  }
  return null;
};
/* Role thực tế của user trong ca hiện tại.
   v1.11: role KHÔNG còn cố định theo staff.role (trừ admin) — thành viên lấy role
   100% từ shift_assignments; chưa tới ca / chưa được phân ⇒ "off" (màn Nghỉ).
   adminAsMember=true ⇒ admin tạm chạy như thành viên (theo ca được phân, nếu có). */
const getEffectiveRole = (currentShift, shiftAssignments, user, adminAsMember=false) => {
  if (!user) return null;
  if (user.isAdmin === true && !adminAsMember) return "admin";
  if (!currentShift) return "off";
  const a = shiftAssignments.find(x => x.shift_id===currentShift.id && x.staff_id===user.id);
  return a ? a.role : "off";
};

const isoToVN  = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const isoToVNShort = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}`; };
const addDaysISO = (s,n)=>{ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return toISO(d); };
const WEEKDAY = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
const isoWeekday = s => { if(!s) return ""; return WEEKDAY[new Date(s+"T00:00:00").getDay()]; };

const schedLabel = o => { if(!o.schA && !o.schD) return ""; const day = (o.schD && o.schD!==todayISO()) ? isoToVNShort(o.schD)+" " : ""; return day + (o.schA||""); };
/* Phút còn lại tới giờ giao (null nếu không hẹn giờ). nowD = Date hiện tại */
const minsToDeadline = (o, nowD) => {
  if(!o.schA) return null;
  const [h,m]=(o.schA||"0:0").split(":").map(Number);
  const day = o.schD || todayISO();
  const dl = new Date(day+"T00:00:00"); dl.setHours(h||0, m||0, 0, 0);
  return Math.round((dl - nowD)/60000);
};

/* Bộ chọn giờ 24h (HH:MM) — 2 dropdown, hiển thị luôn dạng 24:00 không phụ thuộc locale trình duyệt */
function Time24({value,onChange,minuteStep=1,style}){
  const [vh,vm] = (value||"").split(":");
  const hh = value ? String(+vh).padStart(2,"0") : "";
  const mm = value ? String(+vm).padStart(2,"0") : "";
  const hours = Array.from({length:24},(_,i)=>String(i).padStart(2,"0"));

  const sel = {padding:"7px 8px",border:"1px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:13,background:"#fff",cursor:"pointer",fontWeight:700,fontFamily:"ui-monospace,monospace",color:"var(--text)",textAlign:"center"};
  return (
    <div style={{display:"inline-flex",alignItems:"center",gap:4,...style}}>
      <select value={hh} onChange={e=>onChange(`${e.target.value}:${mm||"00"}`)} style={{...sel,flex:1}}>
        <option value="" disabled>--</option>
        {hours.map(x=><option key={x} value={x}>{x}</option>)}
      </select>
      <span style={{fontWeight:800,color:"var(--mut)"}}>:</span>
      <select value={mm} onChange={e=>onChange(`${hh||"00"}:${e.target.value}`)} style={{...sel,flex:1}}>
        <option value="" disabled>--</option>
        {mins.map(x=><option key={x} value={x}>{x}</option>)}
      </select>
    </div>
  );
}

/* Âm thanh thông báo — WebAudio, không cần file asset (giữ single-file) */
let _audioCtx = null;
const playBeep = (kind="new") => {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state==="suspended") ctx.resume();
    const seq = kind==="ship" ? [[880,0],[1320,.13]] : [[660,0],[990,.12],[1320,.24]]; // shipper 2 nốt, mới 3 nốt
    seq.forEach(([f,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      const t0=ctx.currentTime+t;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.32,t0+.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+.16);
      o.start(t0); o.stop(t0+.18);
    });
  } catch(e){}
};

/* Sinh URL VietQR động (img.vietqr.io) — cfg={bank,acc,name} */
const vietqrUrl = (cfg, amount, info) => {
  if(!cfg || !cfg.bank || !cfg.acc) return "";
  const p = new URLSearchParams();
  if(amount>0) p.set("amount", String(Math.round(amount)));
  if(info) p.set("addInfo", info);
  if(cfg.name) p.set("accountName", cfg.name);
  return `https://img.vietqr.io/image/${encodeURIComponent(cfg.bank)}-${encodeURIComponent(cfg.acc)}-compact2.png?${p.toString()}`;
};

/* v1.8: Telegram Bot helpers — token lưu localStorage, chỉ device admin/trưởng ca cấu hình */
const TG = {
  getToken: ()=>localStorage.getItem("clb_tg_token")||"",
  setToken: t=>{ if(t) localStorage.setItem("clb_tg_token",t); else localStorage.removeItem("clb_tg_token"); },
  isOn: ()=>!!localStorage.getItem("clb_tg_token"),
  send: async (chatId, text)=>{
    const token = TG.getToken();
    if (!token || !chatId) return {ok:false,reason:"missing token or chat_id"};
    try{
      const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({chat_id:chatId, text, parse_mode:"HTML", disable_web_page_preview:true})
      });
      const j = await res.json();
      return j;
    }catch(e){ return {ok:false,error:String(e)}; }
  },
  getMe: async ()=>{
    const token = TG.getToken(); if (!token) return null;
    try{ const r = await fetch(`https://api.telegram.org/bot${token}/getMe`); return await r.json(); }
    catch(e){ return {ok:false,error:String(e)}; }
  },
  // Leader election: client với user.id thấp nhất trong onlineUsers (đang trong ca) sẽ là người gửi noti khi event không có actor rõ ràng
  isLeader: (currentUserId, onlineUsers)=>{
    if (!currentUserId || !onlineUsers?.length) return false;
    const ids = onlineUsers.map(u=>u.id).filter(Boolean).sort((a,b)=>a-b);
    return ids[0] === currentUserId;
  },
};

/* ══════════════════════════════════════════════════════════
   LOGIN SCREEN (PIN)
══════════════════════════════════════════════════════════ */
function LoginScreen({staff,onLogin}){
  const [username,setUsername] = useState(()=>localStorage.getItem("lastUsername")||"");
  const [pin,setPin] = useState("");
  const [err,setErr] = useState("");
  const [shake,setShake] = useState(false);
  const unameRef = useRef(null);

  const tryLogin = (val) => {
    const uname = (username||"").trim().toLowerCase();
    if (!uname) {
      setErr("Hãy nhập tên đăng nhập");
      setShake(true); setTimeout(()=>setShake(false),400);
      unameRef.current?.focus();
      setTimeout(()=>setPin(""),300);
      return;
    }
    const u = staff.find(s=>(s.username||"").toLowerCase()===uname && s.pin===val && s.active);
    if (u) {
      localStorage.setItem("lastUsername", username.trim());
      onLogin(u);
    } else {
      setErr("Sai tên đăng nhập hoặc PIN, hoặc tài khoản đã ngừng hoạt động");
      setShake(true); setTimeout(()=>setShake(false),400);
      setTimeout(()=>setPin(""),300);
    }
  };

  const press = (n) => {
    if (pin.length>=4) return;
    const next = pin + n;
    setPin(next); setErr("");
    if (next.length===4) setTimeout(()=>tryLogin(next),120);
  };
  const clear = () => { setPin(""); setErr(""); };
  const back  = () => { setPin(p=>p.slice(0,-1)); setErr(""); };

  // Keyboard support — chỉ active khi không focus vào input username
  useEffect(()=>{
    const h = e => {
      if (document.activeElement === unameRef.current) return; // để gõ username tự do
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key==="Backspace") back();
      else if (e.key==="Escape") clear();
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[pin,username]);

  const numBtn = {padding:"18px 0",fontSize:24,fontWeight:600,background:"#FAFAFA",border:"1px solid #F0F0F0",borderRadius:"var(--r-md)",cursor:"pointer",color:"var(--text)",transition:"all .12s var(--ease)",userSelect:"none"};
  const auxBtn = {padding:"18px 0",fontSize:14,fontWeight:600,background:"#fff",border:"1px solid #F0F0F0",borderRadius:"var(--r-md)",cursor:"pointer",color:"var(--mut)",transition:"all .12s var(--ease)"};

  return (
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"linear-gradient(135deg,#FFE4D8 0%,#FFF4F0 50%,#FFEDE5 100%)",position:"relative",overflow:"hidden",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
      <div style={{position:"absolute",top:-80,left:-80,width:280,height:280,borderRadius:"50%",background:"radial-gradient(circle,rgba(238,77,45,.18) 0%,transparent 70%)"}}/>
      <div style={{position:"absolute",bottom:-100,right:-100,width:320,height:320,borderRadius:"50%",background:"radial-gradient(circle,rgba(238,77,45,.14) 0%,transparent 70%)"}}/>

/* ══════════════════════════════════════════════════════════
   RECIPE MODAL
══════════════════════════════════════════════════════════ */
function RecipeModal({product,onClose,onSave,toast}){
  const [editing,setEditing] = useState(false);
  const [r,setR]   = useState({...product.recipe,ing:[...product.recipe.ing],steps:[...product.recipe.steps]});
  const [ing,setIng] = useState(product.recipe.ing.join("\n"));
  const [stp,setStp] = useState(product.recipe.steps.join("\n"));

  const save=()=>{
    const updated={...r,ing:ing.split("\n").map(s=>s.trim()).filter(Boolean),steps:stp.split("\n").map(s=>s.trim()).filter(Boolean)};
    setR(updated); onSave(updated); setEditing(false);
    toast("Đã lưu công thức","success");
  };

  const importFile=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      const lines=ev.target.result.split("\n").map(s=>s.trim()).filter(Boolean);
      setIng(lines.join("\n")); setEditing(true);
      toast("Đã import. Kiểm tra và lưu lại","info");
    };
    rd.readAsText(f);
  };

  const copy=()=>{
    const txt=`${product.emoji} ${product.name}\n\nNguyên liệu (${r.serves} khẩu phần):\n${r.ing.map(s=>"• "+s).join("\n")}\n\nCách làm:\n${r.steps.map((s,i)=>`${i+1}. ${s}`).join("\n")}`;
    navigator.clipboard?.writeText(txt); toast("Đã sao chép công thức","success");
  };

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn .15s"}}>
      <div style={{background:"#fff",borderRadius:12,width:540,maxHeight:"86vh",overflow:"auto",padding:24,animation:"fadeUp .2s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <div style={{fontSize:18,fontWeight:700,color:"#212121",marginBottom:3}}>{product.emoji} {product.name}</div>
            <div style={{fontSize:11,color:"#767676"}}>{r.serves} khẩu phần · ⏱ {r.prep}</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {!editing
              ? <button onClick={()=>setEditing(true)} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 12px",background:"#FFF4F0",border:"none",borderRadius:6,color:"#EE4D2D",fontSize:12,fontWeight:600,cursor:"pointer"}}><i className="ti ti-edit" style={{fontSize:13}}/>Chỉnh sửa</button>
              : <>
                  <button onClick={()=>setEditing(false)} style={{padding:"6px 12px",background:"#f5f5f5",border:"none",borderRadius:6,color:"#475569",fontSize:12,cursor:"pointer"}}>Huỷ</button>
                  <button onClick={save} className="btn-pri" style={{display:"flex",alignItems:"center",gap:4,padding:"6px 12px",borderRadius:6,fontSize:12}}><i className="ti ti-check" style={{fontSize:13}}/>Lưu</button>
                </>
            }
            <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:22,lineHeight:1}}>✕</button>
          </div>
        </div>

        <div style={{background:"#f8f8f8",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#475569"}}>
          <span style={{fontWeight:600,color:"#212121"}}>Thời gian: </span>{r.prep}
          {!editing&&<>
            <span style={{margin:"0 12px",color:"#e0e0e0"}}>|</span>
            <span style={{fontWeight:600,color:"#212121"}}>Khẩu phần: </span>{r.serves}
          </>}
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
            <span style={{width:20,height:20,background:"#FFF4F0",borderRadius:4,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#EE4D2D",fontWeight:700}}>1</span>
            Nguyên liệu
          </div>
          {!editing
            ? <ul style={{paddingLeft:20,display:"flex",flexDirection:"column",gap:4}}>
                {r.ing.map((s,i)=><li key={i} style={{fontSize:13,color:"#475569",lineHeight:1.5}}>{s}</li>)}
              </ul>
            : <textarea value={ing} onChange={e=>setIng(e.target.value)}
                style={{width:"100%",height:110,padding:"8px 10px",border:"1px solid #e0e0e0",borderRadius:6,fontSize:12,resize:"vertical",lineHeight:1.6}}
                placeholder="Mỗi nguyên liệu 1 dòng..."/>
          }
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
            <span style={{width:20,height:20,background:"#dbeafe",borderRadius:4,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#1e40af",fontWeight:700}}>2</span>
            Các bước thực hiện
          </div>
          {!editing
            ? <ol style={{paddingLeft:20,display:"flex",flexDirection:"column",gap:6}}>
                {r.steps.map((s,i)=><li key={i} style={{fontSize:13,color:"#475569",lineHeight:1.5}}>{s}</li>)}
              </ol>
            : <textarea value={stp} onChange={e=>setStp(e.target.value)}
                style={{width:"100%",height:130,padding:"8px 10px",border:"1px solid #e0e0e0",borderRadius:6,fontSize:12,resize:"vertical",lineHeight:1.6}}
                placeholder="Mỗi bước 1 dòng..."/>
          }
        </div>

        <div style={{paddingTop:12,borderTop:"1px solid #f0f0f0",display:"flex",gap:8,alignItems:"center"}}>
          <label style={{display:"flex",alignItems:"center",gap:5,padding:"7px 12px",background:"#f5f5f5",borderRadius:6,fontSize:12,color:"#475569",cursor:"pointer",fontWeight:500}}>
            <i className="ti ti-upload" style={{fontSize:13}}/>Import .txt
            <input type="file" accept=".txt" style={{display:"none"}} onChange={importFile}/>
          </label>
          <button onClick={copy} style={{display:"flex",alignItems:"center",gap:5,padding:"7px 12px",background:"#f5f5f5",border:"none",borderRadius:6,fontSize:12,color:"#475569",cursor:"pointer",fontWeight:500}}>
            <i className="ti ti-copy" style={{fontSize:13}}/>Sao chép
          </button>
          <div style={{flex:1}}/>
          {editing&&<div style={{fontSize:11,color:"#94a3b8"}}>* Mỗi nguyên liệu / bước 1 dòng</div>}
        </div>
      </div>
    </div>
  );
}

          <div>
