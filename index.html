/* v1.5: Shipper APP — standalone, không sidebar/topbar, full-screen như Grab Driver
   Tab: Pool (đơn chờ tự nhận) / Đang giao / Lịch sử
   Self-claim: tap "Nhận đơn" → UPDATE WHERE sid IS NULL (concurrency-safe) */
function ShipperApp({orders,currentUser,staff,pickup,startShip,complete,cancel,doReturn,onLogout,toast,connStatus,currentShift,onlineUsers,appConfig={},soundEnabled,onToggleSound}){
  // v1.9: bỏ tab pool — shipper KHÔNG tự nhận đơn nữa, chỉ trưởng ca phân
  const [tab,setTab] = useState("active"); // active | history | kpi
  const [qrFor,setQrFor] = useState(null); // đơn đang hiện QR thu tiền
  const [focusId,setFocusId] = useState(null);
  const [returnFor,setReturnFor] = useState(null);
  const [now,setNow] = useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),30000);return()=>clearInterval(t);},[]);

  const mine = orders.filter(o=>o.type==="ship" && o.sid===currentUser.id);
  const active = mine.filter(o=>["san_sang","da_lay","dang_giao"].includes(o.st))
                     .sort((a,b)=>{
                       const order={dang_giao:0,da_lay:1,san_sang:2};
                       return (order[a.st]-order[b.st]) || a.num-b.num;
                     });
  const finished = mine.filter(o=>["hoan_thanh","hoan_hang","huy"].includes(o.st));

  // Focused order: ưu tiên dang_giao → da_lay → san_sang. Nếu user click chọn → giữ
  const current = (focusId && active.find(o=>o.id===focusId)) || active[0] || null;
  const others = current ? active.filter(o=>o.id!==current.id) : active;

  const doneToday = finished.filter(o=>o.st==="hoan_thanh");
  const todayFee = doneToday.reduce((s,o)=>s+(o.dFee||0),0);
  const returnedCount = finished.filter(o=>o.st==="hoan_hang").length;
  const compRate = mine.length ? Math.round(doneToday.length/mine.length*100) : 0;
  // v1.15: KPI giải ngân cả đợt — tổng phí ship đã giao + thưởng/đơn (cấu hình)
  const bonusRate = appConfig?.shipBonus || 0;
  const shipFeeTotal = todayFee;             // tổng phí ship đơn đã giao
  const bonusTotal = doneToday.length * bonusRate;
  const payoutTotal = shipFeeTotal + bonusTotal;

  const elapsed = (t) => {
    if (!t) return 0;
    const [h,m] = t.split(":").map(Number);
    const start = h*60+m;
    const cur = now.getHours()*60+now.getMinutes();
    return Math.max(0, cur-start);
  };

  // Action config theo status hiện tại
  const stConfig = current ? ({
    san_sang: {
      title:"Đến quầy lấy hàng", subtitle:"Trưởng ca đã phân đơn này cho bạn",
      icColor:"#5b21b6", icBg:"#ede9fe", icon:"ti-package",
      mainBtn:{label:"✓ Đã lấy hàng", grad:"linear-gradient(135deg,#7C3AED,#5b21b6)", action:()=>pickup(current.id)},
      altBtn:{label:"Huỷ đơn", color:"var(--err)", action:()=>cancel(current.id)}
    },
    da_lay: {
      title:"Sẵn sàng giao", subtitle:"Lên xe và bấm Bắt đầu khi xuất phát",
      icColor:"#854d0e", icBg:"#fef3c7", icon:"ti-clock",
      mainBtn:{label:"🛵 Bắt đầu giao", grad:"linear-gradient(135deg,#F59E0B,#D97706)", action:()=>startShip(current.id)},
      altBtn:null
    },
    dang_giao: {
      title:"Đang giao đến khách", subtitle:"Bấm Đã giao khi khách nhận hàng",
      icColor:"#c2410c", icBg:"#ffedd5", icon:"ti-motorbike",
      mainBtn:{label:"✓ Đã giao thành công", grad:"linear-gradient(135deg,#22C55E,#15803D)", action:()=>complete(current.id)},
      altBtn:{label:"↩️ Hoàn hàng", color:"#9D174D", action:()=>setReturnFor(current)}
    }
  })[current.st] : null;

  const mapsUrl = (adr) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(adr||"")}`;
  const itemTotal = (o) => (o.items||[]).reduce((s,i)=>s+i.qty*i.p,0) - (o.disc||0);

  return (
    <div style={{height:"100vh",background:"#F5F5F5",display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',system-ui,-apple-system,sans-serif",overflow:"hidden"}}>

      {/* ── App header (logout + connection status) ── */}
      <div style={{background:"#0F172A",color:"#fff",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,borderBottom:"1px solid rgba(255,255,255,.08)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
          <span style={{fontSize:14}}>🛵</span>
          <span style={{fontWeight:800,letterSpacing:.5}}>SHIPPER</span>
          {currentShift && <span style={{fontSize:10.5,opacity:.6,marginLeft:6}}>· {currentShift.name}</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:10.5,display:"flex",alignItems:"center",gap:4,opacity:.85}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:connStatus==="live"?"#22c55e":"#ef4444",boxShadow:connStatus==="live"?"0 0 6px #22c55e":"none"}}/>
            {connStatus==="live"?"Online":"Mất kết nối"}
          </div>
          {onToggleSound && (
            <button onClick={onToggleSound} title={soundEnabled?"Tắt âm thanh":"Bật âm thanh"} aria-label="Âm thanh"
              style={{background:soundEnabled?"rgba(255,255,255,.16)":"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.15)",color:"#fff",fontSize:14,width:30,height:30,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:soundEnabled?1:.6}}>
              <i className={`ti ${soundEnabled?"ti-volume":"ti-volume-off"}`}/>
            </button>
          )}
          <button onClick={onLogout} style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",color:"#fff",fontSize:11,padding:"5px 11px",borderRadius:"var(--r-pill)",cursor:"pointer",fontWeight:600}}>
            <i className="ti ti-logout" style={{fontSize:12,marginRight:4}}/>Thoát
          </button>
        </div>
      </div>

      {/* ── Earnings bar ── */}
      <div style={{background:"linear-gradient(135deg,#1F2937 0%,#111827 100%)",color:"#fff",padding:"12px 16px",flexShrink:0,boxShadow:"0 2px 8px rgba(0,0,0,.15)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <div style={{width:36,height:36,borderRadius:"50%",background:"var(--or)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,boxShadow:"var(--sh-or)"}}>🛵</div>
            <div>
              <div style={{fontSize:13,fontWeight:700}}>{currentUser.name}</div>
              <div style={{fontSize:10.5,opacity:.7,display:"flex",alignItems:"center",gap:4}}>
                <span style={{width:7,height:7,borderRadius:"50%",background:"#22c55e",boxShadow:"0 0 6px #22c55e"}}/>Đang nhận đơn
              </div>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,opacity:.7}}>Phí ship hôm nay</div>
            <div style={{fontSize:17,fontWeight:800,color:"#FCD34D"}}>{fmt(todayFee)}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:1,background:"rgba(255,255,255,.1)",borderRadius:8,padding:1}}>
          {[
            {l:"Đã giao",v:doneToday.length,c:"#22c55e"},
            {l:"Hoàn hàng",v:returnedCount,c:"#F472B6"},
            {l:"Tỉ lệ",v:`${compRate}%`,c:"#FCD34D"}
          ].map(s=>(
            <div key={s.l} style={{background:"rgba(0,0,0,.2)",padding:"7px 4px",textAlign:"center",borderRadius:6}}>
              <div style={{fontSize:9.5,opacity:.7,marginBottom:1}}>{s.l}</div>
              <div style={{fontSize:14,fontWeight:800,color:s.c}}>{s.v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Tab switcher (v1.9: bỏ tab pool) ── */}
      <div style={{display:"flex",background:"#fff",borderBottom:"1px solid var(--bd)",padding:"0 12px",gap:0,flexShrink:0}}>
        {[
          {k:"active", l:"Đang giao",    c:active.length},
          {k:"history",l:"Lịch sử",      c:finished.length},
          {k:"kpi",    l:"KPI / Lương",  c:0}
        ].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)}
            style={{flex:1,padding:"13px 0",border:"none",background:"none",cursor:"pointer",fontSize:12.5,fontWeight:700,
              color:tab===t.k?"var(--or)":"var(--mut)",
              borderBottom:`3px solid ${tab===t.k?"var(--or)":"transparent"}`,
              display:"flex",alignItems:"center",justifyContent:"center",gap:5,position:"relative"}}>
            {t.l}
            {t.c>0 && <span style={{fontSize:10,padding:"2px 6px",borderRadius:"var(--r-pill)",background:t.hl&&tab!==t.k?"#EF4444":(tab===t.k?"var(--or)":"#E5E7EB"),color:(t.hl&&tab!==t.k)||tab===t.k?"#fff":"var(--mut)",fontWeight:800,animation:t.hl&&tab!==t.k?"pulse 1.5s infinite":"none"}}>{t.c}</span>}
          </button>
        ))}
      </div>

      {/* ── Content area (scrollable) ── */}
      <div style={{flex:1,overflowY:"auto",background:"#F5F5F5"}}>

      {/* ── Content ── */}
      {tab==="active" && (
        <div style={{flex:1,padding:"14px",display:"flex",flexDirection:"column",gap:14}}>
          {!current && (
            <div style={{textAlign:"center",padding:"60px 20px",color:"var(--mut)"}}>
              <div style={{fontSize:54,marginBottom:12,opacity:.4}}>☕</div>
              <div style={{fontSize:15,fontWeight:700,color:"var(--text)"}}>Chưa có đơn nào</div>
              <div style={{fontSize:11.5,marginTop:6}}>Trưởng ca sẽ phân đơn cho bạn. Khi có đơn mới, bạn sẽ nhận được thông báo trên điện thoại (Telegram) hoặc trình duyệt.</div>
            </div>
          )}

          {current && (
            <>
              {/* ── ACTIVE ORDER CARD (full-width, big) ── */}
              <div style={{background:"#fff",borderRadius:14,boxShadow:"var(--sh-md)",overflow:"hidden",border:`2px solid ${stConfig.icColor}33`}}>
                {/* Status header */}
                <div style={{padding:"12px 14px",background:stConfig.icBg,display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:40,height:40,borderRadius:10,background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"var(--sh-sm)"}}>
                    <i className={`ti ${stConfig.icon}`} style={{fontSize:20,color:stConfig.icColor}}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:800,color:stConfig.icColor}}>{stConfig.title}</div>
                    <div style={{fontSize:10.5,color:"var(--text2)",marginTop:1}}>{stConfig.subtitle}</div>
                  </div>
                  <span style={{fontFamily:"ui-monospace,monospace",fontSize:12,fontWeight:800,color:stConfig.icColor,background:"#fff",padding:"4px 9px",borderRadius:"var(--r-pill)"}}>{current.id}</span>
                </div>

                {/* Customer block — tap to call */}
                <div style={{padding:"14px",borderBottom:"1px dashed var(--bd2)"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11,color:"var(--mut)",fontWeight:600,textTransform:"uppercase",marginBottom:3}}>Khách hàng</div>
                      <div style={{fontSize:17,fontWeight:800,color:"var(--text)",lineHeight:1.2}}>{current.cus}</div>
                      {current.ph && <div style={{fontSize:13,color:"var(--text2)",marginTop:2}}>📞 {current.ph}</div>}
                    </div>
                    {current.ph && (
                      <a href={`tel:${current.ph}`} style={{textDecoration:"none",width:48,height:48,borderRadius:"50%",background:"#22C55E",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 12px rgba(34,197,94,.35)",flexShrink:0}}>
                        <i className="ti ti-phone-call" style={{fontSize:22,color:"#fff"}}/>
                      </a>
                    )}
                  </div>
                </div>

                {/* v1.9: Hẹn giờ giao */}
                {current.schA && (
                  <div style={{padding:"10px 14px",background:"#EFF6FF",borderBottom:"1px dashed var(--bd2)",display:"flex",alignItems:"center",gap:9}}>
                    <i className="ti ti-clock-hour-4" style={{fontSize:20,color:"#1E40AF",flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,color:"#1E40AF",fontWeight:700,opacity:.85}}>HẸN GIAO LÚC</div>
                      <div style={{fontSize:17,fontWeight:800,color:"#1E40AF"}}>{current.schA}{current.schD && current.schD!==todayISO() ? ` · ${isoWeekday(current.schD)} ${isoToVN(current.schD)}` : ""}</div>
                    </div>
                  </div>
                )}

                {/* v1.11: Điểm lấy hàng */}
                {current.pickupId && pickupName(current.pickupId) && (
                  <div style={{padding:"12px 14px",borderBottom:"1px dashed var(--bd2)",background:"#F5F3FF"}}>
                    <div style={{fontSize:11,color:"#6D28D9",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🏭 Điểm lấy hàng</div>
                    <div style={{fontSize:15,fontWeight:700,color:"#5b21b6"}}>{pickupName(current.pickupId)}</div>
                  </div>
                )}

                {/* Address block — tap to open Maps */}
                <div style={{padding:"14px",borderBottom:"1px dashed var(--bd2)"}}>
                  <div style={{fontSize:11,color:"var(--mut)",fontWeight:600,textTransform:"uppercase",marginBottom:5}}>Địa chỉ giao</div>
                  <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                    <i className="ti ti-map-pin" style={{fontSize:22,color:"var(--or)",flexShrink:0,marginTop:1}}/>
                    <div style={{flex:1,fontSize:15,fontWeight:600,color:"var(--text)",lineHeight:1.4}}>{current.adr||"(không có địa chỉ)"}</div>
                  </div>
                  {current.adr && (
                    <a href={mapsUrl(current.adr)} target="_blank" rel="noopener"
                      style={{textDecoration:"none",marginTop:10,display:"flex",alignItems:"center",justifyContent:"center",gap:7,padding:"11px",background:"linear-gradient(135deg,#3B82F6,#1E40AF)",color:"#fff",borderRadius:10,fontSize:13,fontWeight:700,boxShadow:"0 4px 12px rgba(59,130,246,.25)"}}>
                      <i className="ti ti-navigation" style={{fontSize:16}}/>Mở Google Maps
                    </a>
                  )}
                </div>

                {/* Note (nếu có) */}
                {current.note && (
                  <div style={{padding:"10px 14px",background:"#FFFBEB",borderBottom:"1px dashed var(--bd2)",display:"flex",gap:8,alignItems:"flex-start"}}>
                    <i className="ti ti-alert-circle" style={{fontSize:16,color:"#D97706",flexShrink:0,marginTop:1}}/>
                    <div style={{flex:1,fontSize:12.5,color:"#92400E",fontWeight:600,lineHeight:1.4}}>{current.note}</div>
                  </div>
                )}

                {/* Items + total */}
                <div style={{padding:"14px"}}>
                  <div style={{fontSize:11,color:"var(--mut)",fontWeight:600,textTransform:"uppercase",marginBottom:7}}>{current.items.length} món · {current.items.reduce((s,i)=>s+i.qty,0)} sản phẩm</div>
                  {current.items.map((i,idx)=>(
                    <div key={idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13,padding:"5px 0",borderBottom:idx<current.items.length-1?"1px dashed #F0F0F0":"none"}}>
                      <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:6}}>{i.name} <b style={{color:"var(--or)"}}>×{i.qty}</b></span>
                      {i.note && <span style={{fontSize:10,color:"var(--or)",marginRight:6}}>📝</span>}
                    </div>
                  ))}
                  <div style={{marginTop:10,padding:"10px",background:"linear-gradient(135deg,#FFF4F0 0%,#FFEDE5 100%)",borderRadius:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:10,color:"var(--mut)",fontWeight:600}}>Phí ship của bạn</div>
                      <div style={{fontSize:18,fontWeight:800,color:"var(--or)"}}>{fmt(current.dFee||0)}</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:10,color:"var(--mut)",fontWeight:600}}>Khách trả ({current.pay==="qr"?"QR":"Tiền mặt"})</div>
                      <div style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>{fmt(itemTotal(current)+(current.dFee||0))}</div>
                    </div>
                  </div>
                  {/* v1.15: nút hiện QR thu tiền cho shipper */}
                  <button onClick={()=>setQrFor(current)}
                    style={{width:"100%",marginTop:10,padding:"12px",borderRadius:10,border:"none",cursor:"pointer",background:"linear-gradient(135deg,#0EA5E9,#0369A1)",color:"#fff",fontSize:13.5,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 4px 12px rgba(2,132,199,.28)"}}>
                    <i className="ti ti-qrcode" style={{fontSize:18}}/>Hiện QR thu tiền · {fmt(itemTotal(current)+(current.dFee||0))}
                  </button>
                </div>

                {/* CTA buttons */}
                <div style={{padding:"12px 14px",background:"#FAFAFA",borderTop:"1px solid var(--bd2)",display:"flex",gap:8}}>
                  {stConfig.altBtn && (
                    <button onClick={stConfig.altBtn.action} style={{flex:1,padding:"15px",fontSize:13,fontWeight:700,background:"#fff",color:stConfig.altBtn.color,border:`1.5px solid ${stConfig.altBtn.color}55`,borderRadius:10,cursor:"pointer"}}>
                      {stConfig.altBtn.label}
                    </button>
                  )}
                  <button onClick={stConfig.mainBtn.action} style={{flex:stConfig.altBtn?2:1,padding:"15px",fontSize:15,fontWeight:800,color:"#fff",background:stConfig.mainBtn.grad,border:"none",borderRadius:10,cursor:"pointer",boxShadow:"0 4px 14px rgba(0,0,0,.18)"}}>
                    {stConfig.mainBtn.label}
                  </button>
                </div>
              </div>

              {/* ── Queue: các đơn khác đang chạy ── */}
              {others.length>0 && (
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:"var(--mut)",textTransform:"uppercase",marginBottom:8,padding:"0 4px"}}>📋 Đơn tiếp theo ({others.length})</div>
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {others.map(o=>(
                      <button key={o.id} onClick={()=>setFocusId(o.id)}
                        style={{textAlign:"left",background:"#fff",border:"1px solid var(--bd)",borderRadius:10,padding:"10px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,boxShadow:"var(--sh-sm)"}}>
                        <Bdg s={o.st}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12.5,fontWeight:700,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.cus} · {o.id}</div>
                          <div style={{fontSize:11,color:"var(--mut)",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📍 {o.adr||"—"}</div>
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontSize:13,fontWeight:800,color:"var(--or)"}}>{fmt(o.dFee||0)}</div>
                          <div style={{fontSize:10,color:"var(--mut)"}}>{elapsed(o.t)}p</div>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      )}

      {tab==="history" && (
        <div style={{flex:1,padding:14}}>
          {finished.length===0 ? (
            <div style={{textAlign:"center",padding:"60px 20px",color:"var(--mut)"}}>
              <div style={{fontSize:46,marginBottom:10,opacity:.4}}>📭</div>
              <div style={{fontSize:13}}>Chưa có đơn nào hoàn thành hôm nay</div>
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[...finished].reverse().map(o=>{
                const isCompleted = o.st==="hoan_thanh";
                const isReturned = o.st==="hoan_hang";
                return (
                  <div key={o.id} style={{background:"#fff",borderRadius:10,padding:"11px 13px",border:"1px solid var(--bd)",boxShadow:"var(--sh-sm)",display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:36,height:36,borderRadius:"50%",background:isCompleted?"#dcfce7":isReturned?"#fce7f3":"#fee2e2",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <i className={`ti ${isCompleted?"ti-check":isReturned?"ti-arrow-back":"ti-x"}`} style={{fontSize:18,color:isCompleted?"#15803d":isReturned?"#9d174d":"#b91c1c"}}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                        <span style={{fontFamily:"ui-monospace,monospace",fontSize:11,fontWeight:700,color:"var(--mut)"}}>{o.id}</span>
                        <Bdg s={o.st}/>
                      </div>
                      <div style={{fontSize:13,fontWeight:600,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.cus}</div>
                      {o.returnReason && <div style={{fontSize:10.5,color:"#9d174d",marginTop:2}}>↩️ {o.returnReason}</div>}
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontSize:14,fontWeight:800,color:isCompleted?"#15803d":"var(--mut)"}}>{isCompleted?"+":""}{fmt(o.dFee||0)}</div>
                      <div style={{fontSize:10,color:"var(--mut)"}}>{o.t}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {tab==="kpi" && (
        <div style={{flex:1,padding:14,display:"flex",flexDirection:"column",gap:12}}>
          <div style={{background:"linear-gradient(135deg,#0F172A,#1E293B)",color:"#fff",borderRadius:14,padding:18,boxShadow:"var(--sh-md)"}}>
            <div style={{fontSize:11,opacity:.7,fontWeight:600,letterSpacing:.4}}>💰 TỔNG GIẢI NGÂN DỰ KIẾN (CẢ ĐỢT)</div>
            <div style={{fontSize:32,fontWeight:800,color:"#FCD34D",marginTop:4}}>{fmt(payoutTotal)}</div>
            <div style={{fontSize:10.5,opacity:.6,marginTop:4}}>Cập nhật realtime theo đơn đã giao thành công</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[
              {l:"Đơn đã giao",v:doneToday.length,c:"#15803d",bg:"#dcfce7"},
              {l:"Tổng phí ship",v:fmt(shipFeeTotal),c:"#C2410C",bg:"#ffedd5"},
              {l:`Thưởng (${fmt(bonusRate)}/đơn)`,v:fmt(bonusTotal),c:"#5b21b6",bg:"#ede9fe"},
              {l:"Hoàn hàng",v:returnedCount,c:"#9d174d",bg:"#fce7f3"},
            ].map(s=>(
              <div key={s.l} style={{background:s.bg,borderRadius:12,padding:"13px 14px"}}>
                <div style={{fontSize:10.5,color:s.c,fontWeight:700,opacity:.9}}>{s.l}</div>
                <div style={{fontSize:20,fontWeight:800,color:s.c,marginTop:3}}>{s.v}</div>
              </div>
            ))}
          </div>
          <div style={{background:"#fff",border:"1px solid var(--bd)",borderRadius:12,padding:14}}>
            <div style={{fontSize:12,fontWeight:800,color:"var(--text)",marginBottom:10}}>📦 Chi tiết đơn đã giao</div>
            {doneToday.length===0 ? (
              <div style={{textAlign:"center",padding:"20px 0",color:"var(--mut)",fontSize:12}}>Chưa có đơn giao thành công</div>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {[...doneToday].reverse().map(o=>(
                  <div key={o.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:12,padding:"7px 0",borderBottom:"1px dashed #F0F0F0"}}>
                    <span style={{fontFamily:"ui-monospace,monospace",fontWeight:700,color:"var(--mut)"}}>{o.id}</span>
                    <span style={{flex:1,margin:"0 8px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--text)"}}>{o.cus}</span>
                    <span style={{fontWeight:800,color:"#15803d"}}>+{fmt((o.dFee||0)+bonusRate)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div style={{fontSize:10.5,color:"var(--mut)",textAlign:"center",lineHeight:1.6}}>
            Giải ngân = tổng phí ship đơn đã giao{bonusRate>0?` + thưởng ${fmt(bonusRate)}/đơn`:""}.<br/>Trưởng ca/Admin chốt giải ngân cuối đợt.
          </div>
        </div>
      )}

      </div> {/* /content area */}

      {returnFor && <ReturnReasonModal order={returnFor} onClose={()=>setReturnFor(null)} onConfirm={r=>doReturn(returnFor.id,r)}/>}
      {qrFor && <QrPayModal order={qrFor} appConfig={appConfig} onClose={()=>setQrFor(null)} toast={toast}/>}
    </div>
  );
}

function ShipperScreen({orders,setOrders,setProducts,staff,currentUser,effectiveRole,toast,shiftAssignments=[],currentShift=null,appConfig={}}){
  const [returnFor,setReturnFor] = useState(null);
  // v1.9.1: 2-step assign — chọn shipper rồi mới chốt
  const [pendingPick,setPendingPick] = useState({}); // {[orderId]: shipperId}
  const isShipper   = effectiveRole==="shipper";
  const canAssign   = effectiveRole==="truong_ca" || effectiveRole==="admin" || effectiveRole==="truc_don";

  const ship    = orders.filter(o=>o.type==="ship");
  // v1.12: shipper = người được phân vai "shipper" trong ca hiện tại (role theo ca, không còn role cố định)
  const shippers = currentShift
    ? staff.filter(s=>{
        if (!s.active) return false;
        const a = shiftAssignments.find(x=>x.shift_id===currentShift.id && x.staff_id===s.id);
        return a ? a.role==="shipper" : false;
      })
    : [];

  const setSt = (oid,patch,msg,type="success") => {
    setOrders(os=>os.map(o=>o.id===oid?{...o,...patch}:o));
    if (msg) toast(msg,type);
  };
  // Hoàn kho cho đơn (chỉ khi chưa kết thúc — tránh hoàn 2 lần)
  const restoreStock = (oid) => {
    const o = orders.find(x=>x.id===oid);
    if (!o || ["huy","hoan_thanh","hoan_hang"].includes(o.st)) return;
    setProducts(ps=>ps.map(p=>{const ci=o.items.find(i=>i.pid===p.id);return ci?{...p,stock:p.stock+ci.qty}:p;}));
  };
  const assign  = (oid,sid)=>{
    if (!canAssign) { toast("Bạn không có quyền phân công shipper","warn"); return; }
    const o = orders.find(x=>x.id===oid);
    // v1.6: re-assign — nếu shipper cũ đã pickup/đang giao thì reset về san_sang để shipper mới bắt đầu lại
    const patch = {sid};
    if (o && ["da_lay","dang_giao"].includes(o.st)) {
      patch.st = "san_sang";
    }
    setSt(oid,patch,`Phân công ${staff.find(s=>s.id===sid)?.name} → đơn ${oid}`);
  };
  const pickup    = oid => setSt(oid,{st:"da_lay"},`Đã ghi nhận lấy đơn ${oid}`);
  const startShip = oid => setSt(oid,{st:"dang_giao"},`Bắt đầu giao đơn ${oid}`);
  const complete  = oid => setSt(oid,{st:"hoan_thanh"},`✓ Giao thành công đơn ${oid}`);
  // v1.9: Ping shipper qua Telegram
  const pingShipper = async (o) => {
    if (!o.sid) { toast("Đơn này chưa có shipper","warn"); return; }
    const sh = staff.find(s=>s.id===o.sid);
    if (!sh) { toast("Không tìm thấy shipper","error"); return; }
    if (!TG.isOn()) { toast("Chưa cấu hình Telegram Bot (Cài đặt → Telegram Bot)","warn"); return; }
    if (!sh.telegram_chat_id) { toast(`${sh.name} chưa link chat Telegram`,"warn"); return; }
    const msg = `🔔 <b>Nhắc nhở từ Trưởng ca</b>\nĐơn <b>${o.id}</b> · ${o.cus}${o.ph?` · ${o.ph}`:""}\n📍 ${o.adr||"(tại chỗ)"}${o.schA?`\n⏰ <b>Hẹn giao: ${schedLabel(o)}</b>`:""}\n💰 Phí ship: ${fmt(o.dFee||0)}\n💬 Vui lòng xử lý ngay!`;
    const r = await TG.send(sh.telegram_chat_id, msg);
    if (r && r.ok) toast(`✓ Đã ping ${sh.name} qua Telegram`,"success");
    else toast(`Gửi ping thất bại${r?.description?`: ${r.description}`:""}`,"error");
  };
  const cancel    = oid => { if(!confirm("Huỷ đơn này?")) return; restoreStock(oid); setSt(oid,{st:"huy"},"Đã huỷ đơn · đã hoàn kho","warn"); };
  // Hoàn hàng: hoàn kho cho đồ pha chế thì không hợp lý (đã pha rồi), nhưng đồ san_co/kho thì có thể trả lại.
  // Để đơn giản giai đoạn này: KHÔNG hoàn kho khi hoàn hàng — đó là hàng đã đi ra.
  const doReturn  = (oid,reason) => { setSt(oid,{st:"hoan_hang",returnReason:reason},"↩️ Đã ghi nhận hoàn hàng","warn"); setReturnFor(null); };

  /* Shipper role giờ dùng ShipperApp standalone (early return ở App component) */

  /* ── VIEW CHO TRƯỞNG CA / ADMIN ── */
  const wait     = ship.filter(o=>o.st==="san_sang");
  const picked   = ship.filter(o=>o.st==="da_lay");
  const onroute  = ship.filter(o=>o.st==="dang_giao");
  const finished = ship.filter(o=>o.st==="hoan_thanh");
  const returned = ship.filter(o=>o.st==="hoan_hang");

  const stats=[
    {l:"Chờ phân công",v:wait.length,   ic:"ti-clock",       bg:"#ede9fe",tc:"#5b21b6"},
    {l:"Shipper đang đi",v:picked.length+onroute.length,ic:"ti-motorbike",bg:"#ffedd5",tc:"#c2410c"},
    {l:"Đã giao",     v:finished.length,ic:"ti-circle-check",bg:"#dcfce7",tc:"#15803d"},
    {l:"Hoàn hàng",   v:returned.length,ic:"ti-arrow-back",  bg:"#fce7f3",tc:"#9d174d"},
  ];

  // v1.9.1: cần điều phối = ship đang chuẩn bị (pha_che) + sẵn sàng (san_sang)
  const needCoord = ship.filter(o=>["pha_che","san_sang"].includes(o.st)).sort((a,b)=>{
    // Đã có sid xuống cuối (vì đã chốt rồi), san_sang lên trước pha_che
    const aSid = a.sid?1:0, bSid = b.sid?1:0;
    if (aSid !== bSid) return aSid-bSid;
    if (a.st !== b.st) return a.st==="san_sang"?-1:1;
    return a.num-b.num;
  });
  const shipperLoad = sh => orders.filter(x=>x.sid===sh.id&&["san_sang","da_lay","dang_giao"].includes(x.st)).length;
  const setPick = (oid, sid) => setPendingPick(p=>({...p, [oid]:sid}));
  const clearPick = oid => setPendingPick(p=>{const n={...p}; delete n[oid]; return n;});
  const confirmAssign = (o) => {
    const sid = pendingPick[o.id];
    if (!sid) return;
    assign(o.id, sid);
    clearPick(o.id);
  };

  return (
    <div style={{flex:1,overflowY:"auto",padding:16,background:"var(--bg)"}}>

      {/* v1.9.3: PHÂN CÔNG SHIPPER — LUÔN render, đầu trang — flow Chọn → Chốt → Ping */}
      {canAssign && (
        <div style={{background:"linear-gradient(135deg,#FFF4F0 0%,#FFEDE5 100%)",border:"2px solid var(--or)",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 4px 16px rgba(238,77,45,.12)"}}>
          <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:12,flexWrap:"wrap"}}>
            <div style={{width:38,height:38,borderRadius:10,background:"var(--or-grad)",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,boxShadow:"var(--sh-or)"}}>🛵</div>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontSize:15,fontWeight:800,color:"var(--or)",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                Phân công Shipper
                <span style={{fontSize:9.5,fontWeight:800,background:"var(--or)",color:"#fff",padding:"2px 7px",borderRadius:"var(--r-pill)",letterSpacing:.3}}>v{VERSION}</span>
              </div>
              <div style={{fontSize:10.5,color:"var(--text2)",marginTop:1}}>1️⃣ Chọn shipper · 2️⃣ Xác nhận chốt · 3️⃣ Gửi thông báo Telegram</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text2)",background:"#fff",padding:"6px 11px",borderRadius:"var(--r-pill)",border:"1px solid var(--bd)"}}>
              <i className="ti ti-users" style={{fontSize:13,color:"var(--or)"}}/>
              <span>Shipper trong ca: <b style={{color:"var(--or)"}}>{shippers.length}</b></span>
            </div>
          </div>

          {shippers.length===0 && (
            <div style={{background:"#FEE2E2",border:"1px solid #FCA5A5",borderRadius:8,padding:"10px 12px",marginBottom:10,fontSize:11.5,color:"#B91C1C",fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
              <i className="ti ti-alert-triangle" style={{fontSize:14}}/>
              Không có shipper nào đang trực trong ca hiện tại. Vào <b>Cài đặt → Lịch ca</b> để phân shipper vào ca.
            </div>
          )}

          {needCoord.length===0 && (
            <div style={{background:"#fff",border:"1px dashed var(--bd)",borderRadius:8,padding:"14px 16px",textAlign:"center",color:"var(--mut)",fontSize:12}}>
              <i className="ti ti-coffee" style={{fontSize:22,display:"block",marginBottom:6,opacity:.5,color:"var(--or)"}}/>
              Chưa có đơn ship nào đang pha / sẵn sàng giao.<br/>
              <span style={{fontSize:10.5}}>Khi đơn ship chuyển sang trạng thái <b>"Đang pha"</b> hoặc <b>"Chờ shipper"</b>, đơn sẽ xuất hiện ở đây để phân công.</span>
            </div>
          )}

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {needCoord.map(o=>{
              const isPrep = o.st==="pha_che";
              const hasSid = !!o.sid;
              const sh = hasSid ? staff.find(s=>s.id===o.sid) : null;
              const picked = pendingPick[o.id];
              const pickedSh = picked ? staff.find(s=>s.id===picked) : null;
              const tgReady = TG.isOn() && sh?.telegram_chat_id;
              const loads = shippers.map(s=>({s, load:shipperLoad(s)}));
              const minLoad = loads.length ? Math.min(...loads.map(l=>l.load)) : 0;

              return (
                <div key={o.id} style={{background:"#fff",borderRadius:10,padding:"11px 13px",border:`1.5px solid ${hasSid?"#22C55E":"var(--bd)"}`,boxShadow:"var(--sh-sm)"}}>
                  {/* Header */}
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7,gap:6,flexWrap:"wrap"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontFamily:"ui-monospace,monospace",fontSize:12.5,fontWeight:800,color:"var(--or)"}}>{o.id}</span>
                      <Bdg s={o.st}/>
                      {isPrep && <span style={{fontSize:10,padding:"2px 7px",background:"#FEF3C7",color:"#92400E",borderRadius:"var(--r-pill)",fontWeight:700}}>⏳ Đang pha</span>}
                      <span style={{fontSize:12,fontWeight:700,color:"var(--text)"}}>{o.cus}</span>
                      {o.ph && <span style={{fontSize:10.5,color:"var(--mut)"}}>· {o.ph}</span>}
                    </div>
                    <span style={{fontSize:13,fontWeight:800,color:"var(--or)"}}>+{fmt(o.dFee||0)}</span>
                  </div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:9,fontSize:11.5,color:"var(--text2)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:4,flex:1,minWidth:180}}>
                      <i className="ti ti-map-pin" style={{fontSize:13,color:"var(--or)"}}/>{o.adr||"—"}
                    </div>
                    {o.pickupId && pickupName(o.pickupId) && <span style={{fontSize:11,padding:"3px 8px",background:"#F5F3FF",color:"#6D28D9",border:"1px solid #C4B5FD",borderRadius:"var(--r-pill)",fontWeight:700}}>🏭 {pickupName(o.pickupId)}</span>}
                    {o.schA && <span style={{fontSize:11,padding:"3px 8px",background:"#EFF6FF",color:"#1E40AF",border:"1px solid #93C5FD",borderRadius:"var(--r-pill)",fontWeight:700}}>⏰ {schedLabel(o)}</span>}
                  </div>

                  {/* STATE A: chưa có sid, chưa chọn — show shipper chips + combo */}
                  {!hasSid && !picked && shippers.length>0 && (
                    <div style={{background:"#FAFAFA",border:"1px dashed var(--bd)",borderRadius:8,padding:"9px 10px"}}>
                      <div style={{fontSize:11,color:"var(--text2)",fontWeight:700,marginBottom:7,display:"flex",alignItems:"center",gap:5}}>
                        <span style={{background:"var(--or)",color:"#fff",width:18,height:18,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800}}>1</span>
                        Chọn shipper trong ca
                      </div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
                        {loads.map(({s,load})=>{
                          const busy = load>0;
                          const suggested = load===minLoad;
                          return (
                            <button key={s.id} onClick={()=>setPick(o.id, s.id)} title={`${load} đơn đang giao${suggested?" · gợi ý":""}`}
                              style={{display:"flex",alignItems:"center",gap:5,padding:"6px 10px",background:busy?"#FEF3C7":"#DCFCE7",border:`${suggested?"2px":"1.5px"} solid ${busy?"#F59E0B":"#22C55E"}`,borderRadius:"var(--r-pill)",cursor:"pointer",fontSize:11.5,fontWeight:700,color:busy?"#92400E":"#15803D",position:"relative"}}>
                              {suggested && load===0 && <span style={{position:"absolute",top:-7,right:-3,fontSize:11}}>⭐</span>}
                              <div style={{width:22,height:22,borderRadius:"50%",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800}}>{inits(s.name)}</div>
                              {s.name}{busy && <span style={{fontSize:9,marginLeft:2}}>🛵{load}</span>}
                            </button>
                          );
                        })}
                      </div>
                      <div style={{maxWidth:280}}>
                        <StaffCombo staffList={shippers} accent="var(--or)"
                          placeholder="🔍 Hoặc gõ tên shipper..."
                          onPick={sid=>setPick(o.id, sid)}/>
                      </div>
                    </div>
                  )}

                  {/* STATE B: đã chọn, chưa chốt — show confirm/cancel */}
                  {!hasSid && picked && pickedSh && (
                    <div style={{background:"linear-gradient(135deg,#FFFBEB,#FEF3C7)",border:"2px solid #F59E0B",borderRadius:8,padding:"10px 12px"}}>
                      <div style={{fontSize:11,color:"#92400E",fontWeight:700,marginBottom:8,display:"flex",alignItems:"center",gap:5}}>
                        <span style={{background:"#F59E0B",color:"#fff",width:18,height:18,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800}}>2</span>
                        Xác nhận chốt shipper?
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9,padding:"7px 10px",background:"#fff",borderRadius:6}}>
                        <div style={{width:30,height:30,borderRadius:"50%",background:"#DCFCE7",color:"#15803D",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800}}>{inits(pickedSh.name)}</div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>{pickedSh.name}</div>
                          <div style={{fontSize:10.5,color:"var(--mut)"}}>Đang giao: <b>{shipperLoad(pickedSh)}</b> đơn · {pickedSh.telegram_chat_id?"✓ Có Telegram":"⚠ Chưa link Telegram"}</div>
                        </div>
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>clearPick(o.id)}
                          style={{flex:1,padding:"9px",background:"#fff",border:"1.5px solid var(--bd)",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700,color:"var(--text2)"}}>↺ Chọn lại</button>
                        <button onClick={()=>confirmAssign(o)}
                          style={{flex:2,padding:"9px",background:"linear-gradient(135deg,#22C55E,#15803D)",border:"none",borderRadius:6,cursor:"pointer",fontSize:12.5,fontWeight:800,color:"#fff",boxShadow:"0 2px 8px rgba(34,197,94,.3)"}}>✓ Chốt phân công</button>
                      </div>
                    </div>
                  )}

                  {/* STATE C: đã chốt — show shipper info + Ping + đổi */}
                  {hasSid && sh && (
                    <div style={{background:"#F0FDF4",border:"1.5px solid #22C55E",borderRadius:8,padding:"10px 12px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
                        <div style={{width:32,height:32,borderRadius:"50%",background:"#fff",color:"#15803D",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,border:"2px solid #22C55E"}}>{inits(sh.name)}</div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12.5,fontWeight:800,color:"#15803D",display:"flex",alignItems:"center",gap:5}}>
                            <i className="ti ti-check" style={{fontSize:14}}/>Đã chốt: {sh.name}
                          </div>
                          <div style={{fontSize:10.5,color:"var(--mut)"}}>
                            {isPrep?"Pha xong sẽ sẵn sàng giao":"Sẵn sàng — chờ shipper tới lấy"} · {tgReady?"✓ Telegram OK":(TG.isOn()?"⚠ Shipper chưa link chat":"⚠ Chưa bật Telegram")}
                          </div>
                        </div>
                      </div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                        <button onClick={()=>pingShipper(o)} disabled={!tgReady}
                          title={tgReady?"Gửi noti Telegram":(TG.isOn()?"Shipper chưa link Telegram chat_id":"Chưa cấu hình Telegram Bot")}
                          style={{flex:2,minWidth:140,padding:"10px",background:tgReady?"linear-gradient(135deg,#3B82F6,#1E40AF)":"#E5E7EB",border:"none",borderRadius:6,cursor:tgReady?"pointer":"not-allowed",fontSize:12.5,fontWeight:800,color:tgReady?"#fff":"#9CA3AF",boxShadow:tgReady?"0 2px 8px rgba(59,130,246,.3)":"none",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                          🔔 Gửi thông báo Telegram
                        </button>
                        <button onClick={()=>{if(confirm(`Đổi shipper cho đơn ${o.id}? Sẽ bỏ ${sh.name} ra.`)){setSt(o.id,{sid:null},`Đã bỏ ${sh.name} khỏi đơn ${o.id}`,"info");}}}
                          style={{flex:1,minWidth:90,padding:"10px",background:"#fff",border:"1.5px solid var(--bd)",borderRadius:6,cursor:"pointer",fontSize:11.5,fontWeight:700,color:"var(--text2)"}}>↻ Đổi shipper</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Stats — sau HERO để HERO nổi bật trên cùng */}
      <div className="grid-stats-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}}>
        {stats.map(s=>(
          <div key={s.l} className="card" style={{padding:"13px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
              <div style={{fontSize:11,color:"#767676"}}>{s.l}</div>
              <div style={{width:32,height:32,borderRadius:7,background:s.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><i className={`ti ${s.ic}`} style={{fontSize:15,color:s.tc}}/></div>
            </div>
            <div style={{fontSize:22,fontWeight:800,color:"#212121"}}>{s.v}</div>
          </div>
        ))}
      </div>

      <div className="card" style={{padding:14,marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:10,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          <i className="ti ti-users" style={{color:"var(--or)"}}/>
          <span>Trạng thái Shipper ca này ({shippers.length})</span>
          <span style={{fontSize:10,color:"#999",fontWeight:400,marginLeft:"auto"}}>Tổng quan tải shipper trong ca hoạt động</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
          {shippers.map(s=>{
            const act=orders.filter(o=>o.sid===s.id&&["da_lay","dang_giao"].includes(o.st));
            const dn =orders.filter(o=>o.sid===s.id&&o.st==="hoan_thanh");
            const isBusy = act.length>0;
            return (
              <div key={s.id} style={{border:`1.5px solid ${isBusy?"#fdba74":"#bbf7d0"}`,borderRadius:9,padding:"11px 12px",display:"flex",alignItems:"center",gap:10,background:isBusy?"#fffbeb":"#f0fdf4"}}>
                <div style={{width:36,height:36,borderRadius:"50%",background:"#fff",color:isBusy?"#c2410c":"#16A34A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,border:"1px solid #f0f0f0"}}>{inits(s.name)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#212121",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div>
                  <div style={{fontSize:10,color:isBusy?"#c2410c":"#16A34A",fontWeight:600}}>{isBusy?`🛵 ${act.length} đơn đang giao`:"● Sẵn sàng"}</div>
                  <div style={{fontSize:10,color:"#999"}}>✓ {dn.length} đơn xong</div>
                </div>
              </div>
            );
          })}
          {shippers.length===0&&<div style={{color:"#999",fontSize:12,padding:"14px"}}>Chưa có shipper nào đang trực trong ca</div>}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:12}}>
        {[
          {key:"san_sang",  title:"Chờ phân công", items:wait,    color:"#5b21b6"},
          {key:"da_lay",    title:"Đã lấy hàng",   items:picked,  color:"#854d0e"},
          {key:"dang_giao", title:"Đang giao",      items:onroute, color:"#c2410c"},
          {key:"hoan_thanh",title:"Hoàn thành",     items:finished,color:"#15803d"},
        ].map(col=>(
          <div key={col.key} className="card" style={{overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8,background:col.color+"08"}}>
              <Bdg s={col.key}/><span style={{fontSize:11,color:"#767676"}}>{col.items.length} đơn</span>
            </div>
            <div style={{padding:10,display:"flex",flexDirection:"column",gap:8,maxHeight:480,overflowY:"auto"}}>
              {col.items.map(o=>{
                let actions = null;
                if (col.key==="san_sang") {
                  // v1.9.1: san_sang đã được điều phối ở HERO panel phía trên → chỉ hiển thị status
                  actions = (
                    <div style={{fontSize:10.5,color:"var(--mut)",fontStyle:"italic",padding:"4px 0"}}>
                      {o.sid ? `→ Phân cho ${staff.find(s=>s.id===o.sid)?.name||"shipper"}` : "↑ Phân ở panel Điều phối phía trên"}
                    </div>
                  );
                } else if (col.key==="dang_giao" || col.key==="da_lay") {
                  actions = (
                    <>
                      {canAssign && shippers.length>1 && (
                        <div style={{marginBottom:6,display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                          <span style={{fontSize:10,color:"var(--mut)",fontWeight:700}}>Đổi shipper:</span>
                          {shippers.filter(sh=>sh.id!==o.sid).map(sh=>{
                            const busy=orders.some(x=>x.sid===sh.id&&["da_lay","dang_giao"].includes(x.st));
                            return (
                              <button key={sh.id} onClick={()=>{
                                if(!confirm(`Chuyển đơn ${o.id} từ ${staff.find(s=>s.id===o.sid)?.name||"hiện tại"} sang ${sh.name}?`)) return;
                                assign(o.id,sh.id);
                              }}
                                style={{fontSize:10,padding:"3px 7px",background:busy?"#FFF7ED":"#F0FDF4",border:`1px solid ${busy?"#FB923C":"#22C55E"}40`,borderRadius:4,color:busy?"#9A3412":"#15803D",cursor:"pointer",fontWeight:600}}>
                                ↻ {sh.name.split(" ").slice(-1)[0]}{busy?" 🔴":""}
                              </button>
                            );
                          })}
                        </div>
                      )}
                      <div style={{display:"flex",gap:5}}>
                        {canAssign && o.sid && (
                          <button onClick={()=>pingShipper(o)} title="Gửi noti Telegram cho shipper"
                            style={{fontSize:10.5,padding:"7px 10px",background:"#EFF6FF",border:"1px solid #93C5FD",borderRadius:"var(--r-sm)",color:"#1E40AF",cursor:"pointer",fontWeight:700}}>🔔 Ping</button>
                        )}
                        <button onClick={()=>setReturnFor(o)} style={{flex:1,fontSize:10.5,padding:"7px",background:"#FCE7F3",border:"none",borderRadius:"var(--r-sm)",color:"#9D174D",cursor:"pointer",fontWeight:700}}>↩ Hoàn hàng</button>
                        <button onClick={()=>complete(o.id)} style={{flex:2,fontSize:10.5,padding:"7px",background:"linear-gradient(135deg,#22C55E,#15803D)",border:"none",borderRadius:"var(--r-sm)",color:"#fff",cursor:"pointer",fontWeight:700,boxShadow:"var(--sh-sm)"}}>✓ Đã giao</button>
                      </div>
                    </>
                  );
                }
                return <ShipperOrderCard key={o.id} o={o} staff={staff} actions={actions}/>;
              })}
              {col.items.length===0&&<div style={{textAlign:"center",padding:"24px 0",color:"#999",fontSize:11}}>Trống</div>}
            </div>
          </div>
        ))}
      </div>

      {returned.length>0&&(
        <div className="card" style={{padding:14,marginTop:14}}>
          <div style={{fontSize:13,fontWeight:700,color:"#9d174d",marginBottom:10,display:"flex",alignItems:"center",gap:6}}>
            <Bdg s="hoan_hang"/><span>Đơn hoàn hàng ({returned.length})</span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:8}}>
            {returned.map(o=>(
              <div key={o.id} style={{border:"1px solid #fce7f3",borderRadius:6,padding:"8px 10px",background:"#fff"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:"#9d174d"}}>{o.id}</span>
                  <span style={{fontSize:10,color:"#767676"}}>{o.t}</span>
                </div>
                <div style={{fontSize:11,color:"#212121",fontWeight:600,marginBottom:2}}>{o.cus}</div>
                <div style={{fontSize:10,color:"#9d174d",lineHeight:1.4,background:"#fce7f3",padding:"4px 6px",borderRadius:4,marginTop:4}}>↩️ {o.returnReason||"(Không ghi lý do)"}</div>
                <div style={{fontSize:9,color:"#999",marginTop:3}}>Shipper: {staff.find(x=>x.id===o.sid)?.name||"—"}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {returnFor&&<ReturnReasonModal order={returnFor} onClose={()=>setReturnFor(null)} onConfirm={r=>doReturn(returnFor.id,r)}/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   STAFF SCREEN
══════════════════════════════════════════════════════════ */
function StaffScreen({orders,staff,currentShift,shiftAssignments=[],viewDate,setViewDate}){
  // v1.9.5: KPI đếm theo NGÀY đang xem (trước đây cộng dồn toàn thời gian dù ghi "hôm nay")
  const dayOrders = orders.filter(o=>orderDay(o)===viewDate);
  const kpi=sid=>{
    const mine=dayOrders.filter(o=>o.kpi===sid&&o.st==="hoan_thanh");
    return {cnt:mine.length,rev:mine.reduce((s,o)=>s+iTot(o),0)};
  };
  // v1.7: role thực tế trong ca hiện tại
  const shiftRole = s => roleInShift(s.id, s.isAdmin, currentShift?.id, shiftAssignments);
  return (
    <div style={{flex:1,overflowY:"auto",padding:16,background:"var(--bg)"}}>
      <DateNav date={viewDate} setDate={setViewDate} countLabel={`KPI tính theo đơn HOÀN THÀNH trong ngày · ${dayOrders.filter(o=>o.st==="hoan_thanh").length} đơn xong`}/>
      <div style={{fontSize:11,color:"var(--mut)",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
        <i className="ti ti-info-circle" style={{fontSize:13,color:"var(--or)"}}/>
        {currentShift ? <>Vai trò đếm theo <b>{currentShift.name}</b> ({currentShift.start_at}–{currentShift.end_at}) · KPI đếm theo ngày <b>{isoToVN(viewDate)}</b></> : <>Ngoài giờ làm việc · KPI đếm theo ngày <b>{isoToVN(viewDate)}</b></>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:14}}>
        {["truong_ca","truc_don","pha_che","shipper","admin"].map(role=>{
          const [tc]=RC[role]||["#475569"];
          const cnt = staff.filter(s=>shiftRole(s)===role).length;
          return (
            <div key={role} className="card" style={{padding:"14px",textAlign:"center"}}>
              <div style={{fontSize:24,fontWeight:800,color:tc,marginBottom:2}}>{cnt}</div>
              <div style={{fontSize:11,color:"#767676"}}>{RL[role]}</div>
            </div>
          );
        })}
      </div>

      <div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:10}}>Nhân sự · KPI ngày {isoToVN(viewDate)}</div>
        <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
          <thead>
            <tr>{["Thành viên","Vai trò","Check-in","Trạng thái","Đơn KPI","Doanh thu KPI"].map(h=>(
              <th key={h} style={{padding:"7px 8px",textAlign:"left",fontSize:10,color:"#999",fontWeight:700,borderBottom:"1px solid #f0f0f0",letterSpacing:".3px"}}>{h}</th>
            ))}</tr>
          </thead>
          <tbody>
            {staff.map(s=>{
              const sr = shiftRole(s);                 // role thực tế ca này
              const off = sr === "off";
              const [tc,bg] = off ? ["#64748B","#F1F5F9"] : (RC[sr]||["#475569","#f5f5f5"]);
              const k=kpi(s.id);
              const switched = !off && s.isAdmin && sr !== "admin"; // admin đang làm vai trò theo ca
              return (
                <tr key={s.id} style={{borderBottom:"1px solid #f8f8f8",opacity:s.active && !off ? 1 : .55}}>
                  <td style={{padding:"9px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:30,height:30,borderRadius:"50%",background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:tc,fontWeight:800,flexShrink:0}}>{inits(s.name)}</div>
                      <span style={{color:"#212121",fontWeight:700}}>{s.name}</span>
                    </div>
                  </td>
                  <td style={{padding:"9px 8px"}}>
                    {off ? (
                      <span title={`Mặc định: ${(s.isAdmin?"Admin":"Thành viên")}`} style={{fontSize:10,padding:"3px 8px",borderRadius:4,background:"#F1F5F9",color:"#64748B",fontWeight:700,fontStyle:"italic"}}>Ngoài ca</span>
                    ) : (
                      <span style={{display:"inline-flex",alignItems:"center",gap:4}}>
                        <span style={{fontSize:10,padding:"3px 8px",borderRadius:4,background:bg,color:tc,fontWeight:700}}>{RL[sr]}</span>
                        {switched && <span title={`Mặc định: ${(s.isAdmin?"Admin":"Thành viên")}`} style={{fontSize:9,padding:"1px 5px",borderRadius:"var(--r-pill)",background:"#FFF4F0",color:"var(--or)",fontWeight:800}}>theo ca</span>}
                      </span>
                    )}
                  </td>
                  <td style={{padding:"9px 8px",color:"#767676"}}>{s.checkin}</td>
                  <td style={{padding:"9px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <div style={{width:6,height:6,borderRadius:"50%",background:s.active?"#22c55e":"#cbd5e1"}}/>
                      <span style={{fontSize:11,color:s.active?"#15803d":"#94a3b8",fontWeight:600}}>{s.active?"Đang trực":"Nghỉ"}</span>
                    </div>
                  </td>
                  <td style={{padding:"9px 8px"}}><span style={{fontSize:14,fontWeight:800,color:k.cnt>0?"var(--or)":"#999"}}>{k.cnt} đơn</span></td>
                  <td style={{padding:"9px 8px"}}><span style={{fontSize:12,fontWeight:700,color:k.rev>0?"#15803d":"#999"}}>{k.rev>0?fmt(k.rev):"—"}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        </div>
      </div>

      <div className="card" style={{padding:16}}>
        <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:10}}>🏆 Bảng xếp hạng KPI</div>
        {[...staff].filter(s=>s.active).sort((a,b)=>kpi(b.id).rev-kpi(a.id).rev).map((s,i)=>{
          const sr = shiftRole(s);
          const off = sr === "off";
          const [tc,bg] = off ? ["#64748B","#F1F5F9"] : (RC[sr]||["#475569","#f5f5f5"]);
          const k=kpi(s.id);
          const medal=["🥇","🥈","🥉"][i]||`#${i+1}`;
          return (
            <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:"1px solid #f8f8f8",opacity:off?.65:1}}>
              <span style={{fontSize:i<3?20:13,minWidth:28,textAlign:"center"}}>{medal}</span>
              <div style={{width:30,height:30,borderRadius:"50%",background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:tc,fontWeight:800}}>{inits(s.name)}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:12.5,color:"#212121",fontWeight:700}}>{s.name}</div>
                <div style={{fontSize:10,color:off?"#94a3b8":"#767676",fontStyle:off?"italic":"normal"}}>{off?"Ngoài ca":RL[sr]}</div>
              </div>
              <span style={{fontSize:11,color:"#767676"}}>{k.cnt} đơn</span>
              <span style={{fontSize:13,fontWeight:800,color:k.rev>0?"#15803d":"#999",minWidth:100,textAlign:"right"}}>{k.rev>0?fmt(k.rev):"—"}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   REPORT SCREEN
══════════════════════════════════════════════════════════ */
function ReportScreen({orders:allOrders,staff,products,shift,toast,viewDate,setViewDate,shiftAssignments=[],currentShift=null,appConfig={}}){
  // v1.9.5: BÁO CÁO THEO NGÀY — trước đây cộng dồn toàn thời gian dù ghi "cuối ca/hôm nay"
  const orders  = allOrders.filter(o=>orderDay(o)===viewDate);

  // v1.16: KPI / chi phí Shipper — CẢ ĐỢT (toàn bộ ngày, phục vụ giải ngân cuối đợt)
  const bonusRate = appConfig?.shipBonus || 0;
  const payrollMap = {};
  allOrders.filter(o=>o.type==="ship"&&o.st==="hoan_thanh").forEach(o=>{
    if(o.sid==null) return;
    const m=payrollMap[o.sid]=payrollMap[o.sid]||{count:0,fee:0};
    m.count++; m.fee+=o.dFee||0;
  });
  const payroll = Object.entries(payrollMap)
    .map(([sid,m])=>({sid:+sid,name:staff.find(s=>s.id===+sid)?.name||"—",count:m.count,fee:m.fee,bonus:m.count*bonusRate,total:m.fee+m.count*bonusRate}))
    .sort((a,b)=>b.total-a.total);
  const payrollTotal = payroll.reduce((s,p)=>s+p.total,0);
  const payrollOrders = payroll.reduce((s,p)=>s+p.count,0);
  const exportPayrollCSV=()=>{
    const rows=[["Shipper","Số đơn giao","Tổng phí ship","Thưởng","Giải ngân"]];
    payroll.forEach(p=>rows.push([p.name,p.count,p.fee,p.bonus,p.total]));
    rows.push(["TỔNG",payrollOrders,payroll.reduce((s,p)=>s+p.fee,0),payroll.reduce((s,p)=>s+p.bonus,0),payrollTotal]);
    const esc=c=>{ let s=String(c==null?"":c); if(/^[=+\-@]/.test(s)) s="'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
    const csv="﻿"+rows.map(r=>r.map(esc).join(",")).join("\n");
    const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),download:`LuongShipper_caDot.csv`});
    a.click(); URL.revokeObjectURL(a.href);
    toast("✅ Xuất bảng lương shipper thành công","success");
  };
  const done    = orders.filter(o=>o.st==="hoan_thanh");
  const rev     = done.reduce((s,o)=>s+iTot(o),0);
  const cashRev = done.filter(o=>o.pay==="cash").reduce((s,o)=>s+iTot(o),0);
  const qrRev   = done.filter(o=>o.pay==="qr").reduce((s,o)=>s+iTot(o),0);
  const shipRev = done.filter(o=>o.type==="ship").reduce((s,o)=>s+o.dFee,0);
  const discTot = done.reduce((s,o)=>s+o.disc,0);

  const topProds=products.map(p=>{
    const qty=done.reduce((s,o)=>s+o.items.filter(i=>i.pid===p.id).reduce((s2,i)=>s2+i.qty,0),0);
    return {name:p.name,emoji:p.emoji,qty,rev:qty*p.price};
  }).filter(p=>p.qty>0).sort((a,b)=>b.rev-a.rev);

  const exportCSV=()=>{
    const rows=[["Mã đơn","Khách","SĐT","Giờ","Loại","Địa chỉ","Sản phẩm","Tổng tiền","Thanh toán","Trạng thái","Người tạo","Người KPI"]];
    orders.forEach(o=>rows.push([
      o.id, o.cus, o.ph||"", o.t, o.type, o.adr,
      o.items.map(i=>`${i.name}x${i.qty}`).join(";"),
      iTot(o), o.pay, ST[o.st]?.label||"",
      staff.find(s=>s.id===o.by)?.name||"—",
      staff.find(s=>s.id===o.kpi)?.name||"—",
    ]));
    // v1.9.5 (fix CSV injection + escape): bọc "" cho dấu ngoặc kép, prefix ' nếu ô bắt đầu bằng = + - @ (chống chạy công thức Excel)
    const esc=c=>{ let s=String(c==null?"":c); if(/^[=+\-@]/.test(s)) s="'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
    const csv="﻿"+rows.map(r=>r.map(esc).join(",")).join("\n");
    const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),download:`BaoCao_${viewDate}.csv`});
    a.click(); URL.revokeObjectURL(a.href);
    toast("✅ Xuất báo cáo CSV thành công","success");
  };

  const cards=[
    {l:"Tổng đơn",v:orders.length,sub:`${done.length} hoàn thành`,c:"#1e40af",bg:"#dbeafe"},
    {l:"Doanh thu",v:fmt(rev),sub:`+ Ship ${fmt(shipRev)}`,c:"#15803d",bg:"#dcfce7"},
    {l:"Tiền mặt",v:fmt(cashRev),sub:`${done.filter(o=>o.pay==="cash").length} đơn`,c:"#5b21b6",bg:"#ede9fe"},
    {l:"VietQR",v:fmt(qrRev),sub:`${done.filter(o=>o.pay==="qr").length} đơn`,c:"#0f766e",bg:"#ccfbf1"},
    {l:"Đã giảm giá",v:fmt(discTot),sub:`${orders.filter(o=>o.disc>0).length} đơn KM`,c:"#EE4D2D",bg:"#FFF4F0"},
  ];

  return (
    <div style={{flex:1,overflowY:"auto",padding:16,background:"var(--bg)"}}>
      <DateNav date={viewDate} setDate={setViewDate} countLabel={`${orders.length} đơn trong ngày · ${done.length} hoàn thành · DT ${fmt(rev)}`}/>
      <div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:"#212121"}}>Báo cáo ngày {isoToVN(viewDate)} {viewDate===todayISO()?`· ${shift.name}`:""}</div>
            <div style={{fontSize:11,color:"#767676"}}>{isoWeekday(viewDate)} · Trưởng ca: {(()=>{const a=shiftAssignments.find(x=>x.shift_id===currentShift?.id&&x.role==="truong_ca");return a?(staff.find(s=>s.id===a.staff_id)?.name||"—"):"—";})()}</div>
          </div>
          <button onClick={exportCSV} className="btn-pri" style={{display:"flex",alignItems:"center",gap:6,padding:"9px 18px",borderRadius:8,fontSize:12}}>
            <i className="ti ti-download"/>Xuất CSV
          </button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
          {cards.map(s=>(
            <div key={s.l} style={{background:s.bg,borderRadius:8,padding:"12px 14px"}}>
              <div style={{fontSize:10,color:s.c,opacity:.75,marginBottom:3,fontWeight:700}}>{s.l}</div>
              <div style={{fontSize:15,fontWeight:800,color:s.c,marginBottom:2}}>{s.v}</div>
              <div style={{fontSize:10,color:s.c,opacity:.65}}>{s.sub}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <div className="card" style={{padding:14}}>
          <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:10}}>🔥 Sản phẩm bán chạy</div>
          {topProds.length===0&&<div style={{color:"#999",fontSize:12,textAlign:"center",padding:"24px 0"}}>Chưa có đơn hoàn thành</div>}
          {topProds.map(({name,emoji,qty,rev},i)=>(
            <div key={name} style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
              <span style={{width:22,height:22,borderRadius:4,background:i<3?"#FFF4F0":"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:i<3?"var(--or)":"#767676",fontWeight:800}}>{i+1}</span>
              <span style={{fontSize:14}}>{emoji}</span>
              <span style={{flex:1,fontSize:11.5,color:"#212121",fontWeight:600}}>{name}</span>
              <span style={{fontSize:11,color:"#767676",minWidth:24,textAlign:"right"}}>×{qty}</span>
              <span style={{fontSize:11,fontWeight:700,color:"#212121",minWidth:75,textAlign:"right"}}>{fmt(rev)}</span>
            </div>
          ))}
        </div>

        <div className="card" style={{padding:14}}>
          <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:10}}>📋 Log hoạt động</div>
          <div style={{maxHeight:300,overflowY:"auto"}}>
            {[...orders].reverse().slice(0,15).map((o,i)=>(

/* v1.8: Telegram Bot settings — admin nhập BOT_TOKEN (lưu localStorage), test gửi tin cho staff */
function TelegramSettings({staff,setStaff,toast}){
  const [token,setToken] = useState(TG.getToken());
  const [botInfo,setBotInfo] = useState(null);
  const [busy,setBusy] = useState(false);
  const [updates,setUpdates] = useState([]);

  // Big Update: ghi/xoá BOT_TOKEN trên tất cả tài khoản admin (DB) để sync mọi máy.
  // Dùng setStaff (diff-wrapper tự sync Supabase). Chỉ chạy khi cột tg_token đã tồn tại.
  const persistToAdmins = (t)=>{
    if (!TG_DB_OK) {
      toast("⚠ Chưa có cột tg_token — token mới chỉ lưu máy này. Chạy migration (xem hướng dẫn) để lưu cho mọi máy admin.","warn");
      return;
    }
    setStaff(ss=>ss.map(s=>s.isAdmin?{...s,tg_token:t||null}:s));
    toast(t?"✓ Đã lưu token cho tất cả tài khoản Admin":"✓ Đã xoá token khỏi tài khoản Admin","success");
  };

  const saveToken = async ()=>{
    const t = token.trim();
    TG.setToken(t);
    if (!t) { setBotInfo(null); persistToAdmins(""); return; }
    setBusy(true);
    const me = await TG.getMe();
    if (me?.ok) {
      setBotInfo(me.result);
      toast(`✓ Kết nối @${me.result.username}`,"success");
      persistToAdmins(t);
    } else { setBotInfo(null); toast("Token không hợp lệ","error"); }
    setBusy(false);
  };

  const testSend = async (s)=>{
    if (!s.telegram_chat_id) { toast("Chưa có chat_id cho "+s.name,"warn"); return; }
    setBusy(true);
    const r = await TG.send(s.telegram_chat_id, `🔔 <b>Test từ BaBayBite</b>\nXin chào <b>${s.name}</b>!\nBạn sẽ nhận noti khi có đơn cần xử lý.`);
    setBusy(false);
    if (r?.ok) toast(`✓ Đã gửi tới ${s.name}`,"success");
    else toast(`Lỗi gửi: ${r?.description||r?.error||"không rõ"}`,"error");
  };

  const fetchUpdates = async ()=>{
    if (!TG.isOn()) { toast("Chưa có token","warn"); return; }
    setBusy(true);
    try{
      const r = await fetch(`https://api.telegram.org/bot${TG.getToken()}/getUpdates`);
      const j = await r.json();
      if (j.ok) {
        const chats = [];
        const seen = new Set();
        (j.result||[]).forEach(u=>{
          const c = u.message?.chat;
          if (c && !seen.has(c.id)) { seen.add(c.id); chats.push(c); }
        });
        setUpdates(chats);
        toast(`Tìm thấy ${chats.length} chat đã /start bot`,"info");
      } else toast("Lỗi: "+(j.description||"không rõ"),"error");
    }catch(e){ toast("Lỗi mạng: "+e.message,"error"); }
    setBusy(false);
  };

  const linkChatToStaff = (chatId, staffId)=>{
    setStaff(ss=>ss.map(x=>x.id===staffId?{...x,telegram_chat_id:String(chatId)}:x));
    toast("Đã liên kết","success");
  };

  // Auto-load bot info nếu đã có token
  React.useEffect(()=>{
    if (TG.isOn() && !botInfo) {
      TG.getMe().then(me=>{ if (me?.ok) setBotInfo(me.result); });
    }
  // eslint-disable-next-line
  },[]);

  const withTg = staff.filter(s=>s.telegram_chat_id);
  const withoutTg = staff.filter(s=>s.active && !s.telegram_chat_id);

  return (
    <>
      <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"11px 14px",marginBottom:14,fontSize:11.5,color:"#1E40AF",lineHeight:1.6}}>
        <div style={{display:"flex",gap:8}}>
          <i className="ti ti-info-circle" style={{fontSize:16,flexShrink:0,marginTop:1}}/>
          <div>
            <b>Cách dùng (3 bước):</b>
            <ol style={{margin:"4px 0 0 18px",padding:0}}>
              <li>Chat với <a href="https://t.me/BotFather" target="_blank" style={{color:"#1D4ED8",fontWeight:700}}>@BotFather</a> trên Telegram → <code>/newbot</code> → đặt tên → lấy <b>BOT_TOKEN</b> → dán bên dưới</li>
              <li>Mỗi thành viên chat với bot vừa tạo → gửi <code>/start</code> → bấm <b>"Quét chat đã /start"</b> bên dưới để tự liên kết</li>
              <li>Khi có đơn mới / cần shipper / gán shipper → bot gửi tin về cá nhân trên Telegram (kể cả khi không mở web)</li>
            </ol>
            <div style={{marginTop:6,fontSize:10.5,color:"#475569"}}>🔄 Token được <b>lưu vào tất cả tài khoản Admin</b> (DB) → mọi máy tự nạp khi mở app (cần chạy migration cột <code>tg_token</code>). ⚠ Lưu ý bảo mật: token nằm trong DB đọc được bằng anon key — chỉ dùng bot nội bộ.</div>
          </div>
        </div>
      </div>

      <div className="card" style={{padding:14,marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,color:"#212121",marginBottom:10}}>🤖 Bot Token</div>
        <div style={{display:"flex",gap:8}}>
          <input value={token} onChange={e=>setToken(e.target.value)} placeholder="123456:ABC-DEF..." type="password"
            style={{flex:1,padding:"9px 12px",border:"1px solid var(--bd)",borderRadius:6,fontSize:12,fontFamily:"monospace"}}/>
          <button onClick={saveToken} disabled={busy} className="btn-pri" style={{padding:"9px 16px",borderRadius:6,fontSize:12}}>{busy?"...":"Lưu & Kiểm tra"}</button>
          {TG.isOn() && <button onClick={()=>{setToken("");TG.setToken("");setBotInfo(null);persistToAdmins("");}} style={{padding:"9px 14px",border:"1px solid #fca5a5",background:"#fff",color:"#b91c1c",borderRadius:6,cursor:"pointer",fontSize:12}}>Xoá token</button>}
        </div>
        {botInfo && (
          <div style={{marginTop:10,padding:"8px 12px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:6,fontSize:11.5,color:"#166534",display:"flex",alignItems:"center",gap:8}}>
            <i className="ti ti-circle-check-filled" style={{fontSize:16,color:"#16a34a"}}/>
            <span>Bot <b>@{botInfo.username}</b> ({botInfo.first_name}) sẵn sàng — link: <a href={`https://t.me/${botInfo.username}`} target="_blank" style={{color:"#16a34a",fontWeight:700}}>t.me/{botInfo.username}</a></span>
          </div>
        )}
      </div>

      <div className="card" style={{padding:14,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontSize:13,fontWeight:700,color:"#212121"}}>🔗 Liên kết Chat ID cho từng thành viên</div>
          <button onClick={fetchUpdates} disabled={busy||!TG.isOn()} className="btn-pri" style={{padding:"7px 12px",borderRadius:6,fontSize:11.5}}>
            <i className="ti ti-refresh" style={{fontSize:13,marginRight:4}}/>{busy?"...":"Quét chat đã /start"}
          </button>
        </div>
        {updates.length>0 && (
          <div style={{background:"#fafafa",border:"1px solid #f0f0f0",borderRadius:6,padding:10,marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:"#475569",marginBottom:6}}>Chat đã /start bot ({updates.length}):</div>
            {updates.map(c=>(
              <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid #f0f0f0",fontSize:11.5}}>
                <span style={{fontFamily:"monospace",color:"#475569",minWidth:110}}>{c.id}</span>
                <span style={{flex:1,fontWeight:600}}>{c.first_name||""} {c.last_name||""} {c.username?<span style={{color:"#0088cc"}}>@{c.username}</span>:""}</span>
                <select onChange={e=>{ if(e.target.value) linkChatToStaff(c.id, +e.target.value); e.target.value="";}}
                  style={{padding:"5px 8px",border:"1px solid var(--bd)",borderRadius:5,fontSize:11,background:"#fff"}}>
                  <option value="">→ gán cho…</option>
                  {staff.filter(s=>s.active).map(s=>(
                    <option key={s.id} value={s.id}>{s.name} ({s.username||"?"})</option>
                  ))}
                </select>
              </div>
            ))}
          </div>
        )}

        <div style={{fontSize:11.5,color:"#475569",marginBottom:6,fontWeight:600}}>Đã liên kết ({withTg.length}/{staff.length}):</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,marginBottom:withoutTg.length?14:0}}>
          {withTg.map(s=>(
            <div key={s.id} style={{padding:"8px 10px",background:"#F0F9FF",border:"1px solid #BAE6FD",borderRadius:6,display:"flex",alignItems:"center",gap:8}}>
              <i className="ti ti-brand-telegram" style={{fontSize:18,color:"#0088cc"}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,color:"#212121",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div>
                <div style={{fontSize:10,color:"#475569",fontFamily:"monospace"}}>{s.telegram_chat_id}</div>
              </div>
              <button onClick={()=>testSend(s)} disabled={busy} title="Gửi test" style={{padding:"4px 8px",border:"1px solid #0088cc",background:"#fff",color:"#0088cc",borderRadius:4,cursor:"pointer",fontSize:10,fontWeight:700}}>Test</button>
              <button onClick={()=>{setStaff(ss=>ss.map(x=>x.id===s.id?{...x,telegram_chat_id:null}:x));toast("Đã ngắt","info");}} title="Ngắt liên kết" style={{padding:"4px 6px",border:"1px solid #fca5a5",background:"#fff",color:"#b91c1c",borderRadius:4,cursor:"pointer",fontSize:11}}>✕</button>
            </div>
          ))}
        </div>

        {withoutTg.length>0 && (
          <>
            <div style={{fontSize:11.5,color:"#94a3b8",marginBottom:6,fontWeight:600}}>Chưa liên kết ({withoutTg.length}):</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {withoutTg.map(s=>(
                <span key={s.id} style={{fontSize:11,padding:"4px 9px",background:"#F1F5F9",color:"#64748B",borderRadius:"var(--r-pill)",fontWeight:600}}>{s.name}</span>
              ))}
            </div>
          </>
        )}
      </div>
    </>
  );
}
